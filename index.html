    '<button class="fchip c-'+kind+(on?" on":"")+'" data-a="mfil" data-k="'+kind+'" data-v="'+esc(key)+'">'
    + esc(label) + (n!==null?' '+n:'') + '</button>';
  const anyFilter = mflags.length || mtags.length;
  h+='<div class="panel"><div class="row" style="margin-bottom:11px;flex-wrap:nowrap">'

    + (noneN  ? fchip("none","none","뜻 없음",noneN, mflags.includes("none")) : "")
    + (suspN  ? fchip("susp","susp","보류",suspN, mflags.includes("susp")) : "")

      +(c.tags||[]).map(t=>' <span class="chip">'+esc(t)+'</span>').join("")+'</div>'
      +'<div class="itemm">'+(c.meaning?esc(c.meaning):'<span style="color:var(--rose)">뜻 없음</span>')+'</div>'
      +(c.example?'<div class="itemex">'+esc(c.example)+'</div>':'')
      +'<div class="meta">'+(c.pack?esc(c.pack)+' · ':'')

}

/* 손그림 느낌을 내려고 같은 별을 두 번 그립니다 — 반듯한 선 하나와 살짝 어긋난 옅은 선 하나 */
const STAR_A = "M60 8 L70.6 35.4 L99.9 37 L77.1 55.6 L84.7 84 L60 68 L35.3 84 L42.9 55.6 L20.1 37 L49.4 35.4 Z";
const STAR_B = "M58.6 10.5 L71.8 34.2 L97.6 38.6 L75.8 56.8 L86.2 82.2 L60.8 69.4 L34.2 85.2 L44.1 54.4 L21.6 35.6 L48.4 36.6 Z";
const SPARK = (x,y,s) => '<path class="st-spark" transform="translate('+x+' '+y+') scale('+s+')" '
  +'d="M0 -7 Q1.2 -1.2 7 0 Q1.2 1.2 0 7 Q-1.2 1.2 -7 0 Q-1.2 -1.2 0 -7 Z"/>';

/** 표정만 바꾸고 몸통은 하나로 씁니다. mood: idle | think | happy | sleep | push */
function lexi(mood, cls){
  const dx = mood==="think" ? 2.6 : 0;
  const eyes = mood==="sleep"
    ? '<path class="st-limb" d="M45 48q5 4.5 10 0"/><path class="st-limb" d="M65 48q5 4.5 10 0"/>'
    : mood==="push"
    ? '<path class="st-limb" d="M45 50q5-5 10 0"/><path class="st-limb" d="M65 50q5-5 10 0"/>'
    : mood==="angry"
    ? '<path class="st-limb" d="M42 43l13 6"/><path class="st-limb" d="M78 43l-13 6"/>'
      +'<circle class="st-eye" cx="51" cy="51" r="3.4"/><circle class="st-eye" cx="69" cy="51" r="3.4"/>'
    : '<g class="st-eyes"><circle class="st-eye" cx="'+(50+dx)+'" cy="48" r="3.7"/>'
      +'<circle class="st-eye" cx="'+(70+dx)+'" cy="48" r="3.7"/></g>';
  const mouth = mood==="happy"
    ? '<path class="st-limb" d="M51 59q9 9 18 0"/>'
    : mood==="angry"
    ? '<path class="st-limb" d="M51 64q9-8 18 0"/>'
    : mood==="push"
    ? '<path class="st-limb" d="M53 61q7 4 14 0q-7 4-14 0Z"/>'
    : mood==="think"
    ? '<path class="st-limb" d="M52 61q4-3 8 0t8 0"/>'
    : '<path class="st-limb" d="M52 61h16"/>';
  return '<svg class="lexi '+(cls||"")+'" viewBox="0 0 120 120" aria-hidden="true">'
    /* 스티커 테두리 → 채움 → 손그림 윤곽 두 겹 */
    +'<path class="st-halo" d="'+STAR_A+'"/>'
    +'<path class="st-fill" d="'+STAR_A+'"/>'
    +'<path class="st-ink" d="'+STAR_A+'"/>'
    +'<path class="st-ink2" d="'+STAR_B+'"/>'
    /* 팔 — 별 뒤에서 나와 아래로 뻗습니다 */
    +'<path class="st-limb" d="M36 52 L19 67"/>'
    +'<path class="st-limb" d="M19 67l-5.5-1.4M19 67l-2.6 4.6M19 67l1.6-5.4"/>'
    +'<path class="st-limb" d="M84 52 L101 67"/>'
    +'<path class="st-limb" d="M101 67l5.5-1.4M101 67l2.6 4.6M101 67l-1.6-5.4"/>'
    /* 다리 */
    +'<path class="st-limb" d="M54 72 L50 105"/><path class="st-limb" d="M50 105h-7.5"/>'
    +'<path class="st-limb" d="M66 72 L71 105"/><path class="st-limb" d="M71 105h7.5"/>'
    + eyes + mouth
    /* 반짝임 — .shine 을 붙였을 때만 보입니다 */
    + SPARK(104,26,1) + SPARK(18,22,.72) + SPARK(96,96,.85)
    +'</svg>';
}

/* 검색 캐시는 학습 데이터가 아니라 언제든 버려도 되는 것이라 D 바깥의 별도 키에 둡니다.
   D에 넣으면 Gist 동기화 페이로드에 사전 캐시가 통째로 실려 갑니다. */
const DKEY = "lexicon:dict";
const DICT_MAX = 200;

let dictQ="", dictR=null, dictBusy=false, dictErr="";

function dictAll(){ try{ return JSON.parse(localStorage.getItem(DKEY)||"{}"); }catch(e){ return {}; } }
function dictGet(q){ const e=dictAll()[(q||"").trim().toLowerCase()]; return e ? e.r : null; }
function dictPut(q,r){
  try{
    const c=dictAll(); c[(q||"").trim().toLowerCase()]={r:r, t:Date.now()};
    const ks=Object.keys(c);
    if(ks.length>DICT_MAX) ks.sort((a,b)=>c[a].t-c[b].t).slice(0,ks.length-DICT_MAX).forEach(k=>delete c[k]);
    localStorage.setItem(DKEY, JSON.stringify(c));
  }catch(e){}
}
function dictRecent(n){
  const c=dictAll();
  return Object.keys(c).sort((a,b)=>c[b].t-c[a].t).slice(0,n).map(k=>(c[k].r&&c[k].r.q)||k);
}

const DICT_PROMPT = q =>
  '영어 단어·구·숙어의 사전 정보를 JSON 객체 하나로만 출력하세요.\n'
  +'- q: 표제어. 동사는 원형으로, 숙어와 구동사는 입력 형태 그대로\n'
  +'- kind: word · phrase · idiom 중 하나\n'
  +'- ipa: 국제음성기호. 확실하지 않으면 빈 문자열\n'
  +'- senses: 자주 쓰는 뜻부터 최대 3개\n'
  +'   · pos: 한국어 품사 (명사·동사·형용사·부사·구동사·숙어 등)\n'
  +'   · ko: 한국어 뜻 1~2개를 쉼표로 구분\n'
  +'   · en: 쉬운 영어로 쓴 영영 뜻 한 문장\n'
  +'   · ex: 예문 1개. en은 15단어 이내의 자연스러운 문장, ko는 그 번역\n'
  +'- colloc: 자주 함께 쓰는 형태 2~4개\n'
  +'- note: 뉘앙스·격식·주의점을 한국어 한두 문장. 없으면 빈 문자열\n'
  +'- near: 형태나 뜻이 헷갈리는 표현 최대 2개. 없으면 빈 배열\n'
  +'숙어와 구동사도 단어와 똑같이 정상 처리하세요. 영어 표현이 아니면 senses를 빈 배열로 두세요.\n'
  +'\n입력: '+q;

const S_ = (t,o) => Object.assign({type:t}, o||{});
const DICT_SCHEMA = {
  type:"OBJECT",
  properties:{
    q:S_("STRING"), kind:S_("STRING"), ipa:S_("STRING"),
    senses:S_("ARRAY",{items:{ type:"OBJECT",
      properties:{ pos:S_("STRING"), ko:S_("STRING"), en:S_("STRING"),
        ex:S_("ARRAY",{items:{type:"OBJECT",
          properties:{en:S_("STRING"), ko:S_("STRING")}, required:["en","ko"]}}) },
      required:["pos","ko","en","ex"] }}),
    colloc:S_("ARRAY",{items:{type:"STRING"}}),
    note:S_("STRING"),
    near:S_("ARRAY",{items:{type:"OBJECT",
      properties:{w:S_("STRING"), ko:S_("STRING")}, required:["w","ko"]}})
  },
  required:["q","kind","senses"]
};

async function dictFetch(q){
  const prompt=DICT_PROMPT(q);
  let txt="";
  if(D.s.provider==="gemini"){
    const model=D.s.geminiModel||"gemini-2.5-flash";
    const url=GEMINI_URL(model);
    const r=await fetch(url,{ method:"POST", headers:GEMINI_HEADERS(),
      body:JSON.stringify({ contents:[{parts:[{text:prompt}]}],
        generationConfig:{ responseMimeType:"application/json", responseSchema:DICT_SCHEMA } }) });
    if(!r.ok){
      const t=await r.text().catch(()=>"");
      if(r.status===429) throw new Error("무료 한도를 넘었습니다. 잠시 뒤 다시 시도하세요");
      if(r.status===400||r.status===404) throw new Error("모델 이름이나 키를 확인하세요 ("+r.status+")");
      throw new Error("HTTP "+r.status+(t?" · "+t.slice(0,100):""));
    }
    const j=await r.json();
    txt=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[])
      .map(p=>p.text||"").join("");
  }else{
    const r=await fetch("https://api.anthropic.com/v1/messages",{ method:"POST", headers:{
      "content-type":"application/json", "x-api-key":D.s.apiKey,
      "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
      body:JSON.stringify({ model:D.s.model||"claude-sonnet-5", max_tokens:1500,
        messages:[{role:"user", content:prompt}] }) });
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j=await r.json();
    txt=(j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
  }
  const a=txt.indexOf("{"), b=txt.lastIndexOf("}");
  if(a<0||b<0) throw new Error("응답을 읽지 못했습니다");
  const o=JSON.parse(txt.slice(a,b+1));
  if(!o.senses || !o.senses.length) throw new Error("영어 표현이 맞는지 확인해 주세요");
  o.q = (o.q||q).trim();
  return o;
}

/* ── 키 없이 쓰는 무료 사전 ──────────────────────────────────────
   영어 뜻은 영어 위키낱말사전(Wiktionary)에서 그대로 가져옵니다. 사람이 쓴 사전입니다.
   한국어 뜻은 MyMemory 번역을 거칩니다 — 이쪽은 기계 번역이라 틀릴 수 있습니다.
   둘 다 키가 필요 없고 공짜입니다. 대신 한국어 품질은 AI 경로보다 떨어집니다. */
const POS_KO = {
  "Noun":"명사", "Proper noun":"고유명사", "Verb":"동사", "Adjective":"형용사",
  "Adverb":"부사", "Pronoun":"대명사", "Preposition":"전치사", "Conjunction":"접속사",
  "Interjection":"감탄사", "Determiner":"한정사", "Numeral":"수사", "Particle":"조사",
  "Phrase":"표현", "Proverb":"속담", "Idiom":"숙어", "Prefix":"접두사", "Suffix":"접미사",
  "Participle":"분사", "Abbreviation":"약어", "Contraction":"축약형"
};
const hasHangul = s => /[가-힣]/.test(s || "");
const stripTags = s => String(s == null ? "" : s)
  .replace(/<[^>]*>/g, " ").replace(/&nbsp;/g, " ").replace(/&amp;/g, "&")
  .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
  .replace(/\s+/g, " ")
  /* 태그를 빼내면 " ," 처럼 고려져 버리므로 무류표 앞 고려에를 다듬억니다 */
  .replace(/\s+([,.;:!?)\]])/g, "$1")
  .replace(/([(\[])\s+/g, "$1")
  .replace(/\(\s*\)/g, "")
  .replace(/\s+/g, " ").trim();

/** 제한 시간을 붙인 fetch. AbortSignal.timeout 이 없는 옛 브라우저에서도 동작합니다 */
function fetchT(url, ms){
  const opt = {};
  try{ opt.signal = AbortSignal.timeout(ms); }catch(e){}
  return fetch(url, opt);
}
/** 영어 한 토막을 한국어로 옮깁니다. 실패하면 빈 문자열입니다 */
async function translateKo(text){
  const q = String(text || "").trim();
  if(!q) return "";
  try{
    const r = await fetchT("https://api.mymemory.translated.net/get?langpair=en%7Cko&q=" + encodeURIComponent(q), 8000);
    if(!r.ok) return "";
    const j = await r.json();
    if(j.quotaFinished) return "";
    const t = ((j.responseData || {}).translatedText || "").trim();
    /* 번역이 안 되면 영어를 그대로 돌려주거나 대문자 오류 문구를 보냅니다 */
    return hasHangul(t) ? t : "";
  }catch(e){ return ""; }
}

async function dictFetchFree(q){
  const word = String(q || "").trim();
  if(!word) throw new Error("찾을 말을 적어주세요");

  const path = encodeURIComponent(word.replace(/\s+/g, "_"));
  let wd;
  try{
    const r = await fetchT("https://en.wiktionary.org/api/rest_v1/page/definition/" + path, 9000);
    if(r.status === 404) throw new Error("영어 위키낱말사전에 없는 표현입니다. 철자를 확인해 주세요.");
    if(!r.ok) throw new Error("사전 서버가 " + r.status + " 를 돌려줬습니다. 잠시 뒤 다시 시도해 주세요.");
    wd = await r.json();
  }catch(e){
    if(e.name === "TimeoutError") throw new Error("사전 서버가 응답하지 않습니다. 인터넷 연결을 확인해 주세요.");
    throw e;
  }

  const raw = [];
  (wd.en || []).forEach(block => {
    (block.definitions || []).forEach(d => {
      const en = stripTags(d.definition);
      /* 위키낙말사전은 라벏만 달린 번 항목을 돌려주기도 합니다 */
      if(en.length < 3 || !/[a-zA-Z]/.test(en)) return;
      raw.push({
        pos: POS_KO[block.partOfSpeech] || block.partOfSpeech || "",
        en: en,
        ex: (d.examples || []).map(stripTags).filter(x => x.length > 1).slice(0, 1)
      });
    });
  });
  if(!raw.length) throw new Error("영어 뜻을 찾지 못했습니다");

  const keep = raw.slice(0, 4);
  /* 머리말 뜻과 각 뜻풀이를 한꺼번에 번역합니다 */
  const [headKo, ...defKo] = await Promise.all(
    [translateKo(word)].concat(keep.map(s => translateKo(s.en)))
  );

  const senses = [];
  /* 짧은 뜻을 맨 앞에 둡니다 — 번역된 뜻풀이는 문장이 되어 카드 뒷면에 적기엔 깁니다 */
  if(headKo) senses.push({ pos: "짧은 뜻", ko: headKo, en: "", ex: [] });
  keep.forEach((s, i) => senses.push({
    pos: s.pos,
    ko: defKo[i] || headKo || "",
    en: s.en,
    ex: s.ex.map(x => ({ en: x }))
  }));
  /* 번역이 전부 실패했으면 적어도 머리말 뜻이라도 있어야 담을 수 있습니다 */
  if(!senses.some(s => s.ko) && !headKo)
    throw new Error("한국어 뜻을 가져오지 못했습니다. 번역 한도에 걸렸을 수 있으니 잠시 뒤 다시 시도해 주세요.");

  return {
    q: word,
    kind: /\s/.test(word) ? "phrase" : "word",
    src: "free",
    headKo: headKo,
    senses: senses,
    colloc: []
  };
}

async function dictLook(q){
  q=(q||"").trim(); if(!q) return;
  dictQ=q; dictErr=""; dictR=null;
  const hit=dictGet(q);
  if(hit){ dictR=hit; render(); return; }
  dictBusy=true; render();
  try{
    /* AI 키가 있으면 그쪽이 한국어 품질이 좋고, 없으면 무료 사전을 씁니다 */
    const r = aiReady() ? await dictFetch(q) : await dictFetchFree(q);
    dictR=r; dictPut(q,r);
  }
  catch(e){ dictErr=e.message; }
  dictBusy=false; render();
}

/** 사전에서 담은 카드도 AI가 만든 뜻이므로 auto:true — 단어 탭에 "확인 필요"로 표시됩니다 */
function dictFields(i){
  const s=dictR.senses[i];
  return { word:dictR.q, meaning:s.ko,
    example:(s.ex && s.ex[0] && s.ex[0].en) || "",
    collocation:(dictR.colloc||[]).join("; ") };
}
function dictSaved(i){
  if(!dictR) return false;
  const s=dictR.senses[i];
  return D.cards.some(c=>c.word.toLowerCase()===dictR.q.toLowerCase() && c.meaning===s.ko);
}
function dictSave(i){
  if(!dictR || !dictR.senses[i]) return;
  const f=dictFields(i);
  const dup=D.cards.find(c=>c.word.toLowerCase()===f.word.toLowerCase());
  if(dup){
    if(dup.meaning===f.meaning){ toast("이미 담아둔 뜻입니다"); return; }
    askYes("'"+f.word+"' 는 이미 있습니다",
      "지금 뜻 — "+dup.meaning+"\n새 뜻 — "+f.meaning+"\n\n바꿔도 복습 진도는 그대로 남고 내용만 바뀝니다.",
      "새 뜻으로 바꾸기").then(ok=>{
        if(!ok) return;
        Object.assign(dup, {meaning:f.meaning, example:f.example||dup.example,
          collocation:f.collocation||dup.collocation, auto:true});
        save(); render(); toast("뜻을 바꿨습니다");
      });
    return;
  }
  D.cards.push(newCard(Object.assign({}, f,
    {tags:["사전"], pack:D.s.lastPack||"", auto:true})));
  syncPacks(); save(); render();
  toast("담았습니다 · 오늘 학습에 바로 나옵니다");
}

/* ── 통계 ── */
/* ── 복습 상태를 별 표정으로 ──────────────────────────────────────
   숫자만 보면 지금 잘 하고 있는지 알기 어렵습니다. 별이 대신 말해 줍니다. */
function moodNow(){
  const back = dueAll().length;
  const done = dayStat(dayKey()).reviews;
  const st   = streak();
  const left = dueToday().length + freshList().length;
  const n    = D.cards.length;

  if(!n) return {k:"sleep", t:"별이 자고 있습니다",
    s:"아직 단어가 없습니다. 사전 탭에서 하나 찾아 담아보세요."};
  if(back >= 120) return {k:"boom", t:"별이 터지기 직전입니다",
    s:"밀린 카드가 "+back+"장입니다. 오늘 조금만 해도 숨통이 트입니다. 그리고 하루 신규 단어를 줄이세요."};
  if(back >= 50) return {k:"angry", t:"별이 화났습니다",
    s:"밀린 카드가 "+back+"장입니다. 상한은 일을 미룰 뿐 줄이지 않습니다. 신규를 잠깐 멈춰보세요."};
  if(st >= 7 && left === 0) return {k:"blaze", t:st+"일 연속 · 불타는 중",
    s:"오늘 몫까지 끝냈습니다. 이게 제일 좋은 상태입니다."};
  if(left === 0 && done > 0) return {k:"happy", t:"오늘 몫 끝",
    s:"오늘 "+done+"장 했습니다. 내일 또 만나요."};
  if(st >= 3) return {k:"happy", t:st+"일 연속",
    s:"오늘 "+left+"장 남았습니다. 이대로만 가면 됩니다."};
  if(done === 0 && st === 0) return {k:"sleep", t:"별이 자고 있습니다",
    s: left ? ("오늘 "+left+"장이 기다리고 있습니다. 깨워주세요.") : "오늘 할 카드가 없습니다."};
  return {k:"idle", t:"하는 중",
    s:"오늘 "+left+"장 남았습니다"+(done?(" · 지금까지 "+done+"장"):"")+"."};
}

/** 통계 탭 맨 위 — 별 하나로 지금 상태를 보여줍니다 */
function moodPanel(){
  const m = moodNow(), st = streak();
  /* 사흘 이어갈 때마다 별이 하나씩 늘어납니다 (최대 5개) */
  const extra = Math.min(5, Math.floor(st/3));
  let mini = "";
  for(let i=0;i<extra;i++) mini += '<span class="ministar" style="animation-delay:'+(i*170)+'ms">★</span>';

  const face = m.k==="blaze" ? "happy" : m.k==="boom" ? "angry" : m.k;
  const cls  = m.k==="blaze" ? "shine cheerloop"
             : m.k==="boom"  ? "boom"
             : m.k==="angry" ? "shake"
             : m.k==="happy" ? "shine bob"
             : m.k==="sleep" ? "" : "bob";

  return '<div class="panel moodbox"><div class="moodart">'
    + lexi(face, cls)
    + (mini ? '<div class="ministars">'+mini+'</div>' : '')
    + (m.k==="boom" ? '<div class="boomfx"><i></i><i></i><i></i><i></i><i></i></div>' : '')
    + '</div>'
    + '<h3 class="moodt">'+esc(m.t)+'</h3>'
    + '<p class="moods">'+esc(m.s)+'</p>'
    + (extra ? '<p class="moods" style="margin-top:7px;font-size:12.5px">'
        + '사흘 이어갈 때마다 별이 하나씩 늘어납니다 · 지금 '+(extra+1)+'개</p>' : '')
    + '</div>';
}

function viewStats(){
  const seen=D.cards.reduce((s,c)=>s+c.seen,0), cor=D.cards.reduce((s,c)=>s+c.correct,0);
  const acc=seen?Math.round(cor/seen*100):0;
  const fresh=D.cards.filter(c=>c.seen===0).length;
  const lrn=D.cards.filter(c=>c.seen>0&&c.interval<21).length;
  const mat=D.cards.filter(c=>c.interval>=21).length;
  /* 최근 30일 실제 정답률 — 누적보다 지금 상태를 잘 보여줍니다 */
  let rr=0, rc=0;
  for(let i=0;i<30;i++){ const v=dayStat(dayKey(new Date(Date.now()-i*DAY))); rr+=v.reviews; rc+=v.correct; }
  const racc = rr?Math.round(rc/rr*100):null;
  /* ── 한 줄 진단 ── 숫자만 늘어놓으면 뭘 해야 할지 알 수 없으므로 판정을 먼저 보여줍니다.
     정답률 85~90%가 간격 반복의 통상 기준선입니다. 너무 높아도 간격이 짧다는 뜻입니다. */
  const fcAll=new Array(30).fill(0);
  active().forEach(c=>{ if(c.seen===0) return;
    const d=Math.floor((sod(c.due)-sod())/DAY);
    if(d>=0&&d<30) fcAll[d]++; else if(d<0) fcAll[0]++; });
  const peak=Math.max(1,...fcAll);
  const avg=Math.round(fcAll.reduce((a,b)=>a+b,0)/30);
  const over = D.s.maxReview>0 && peak>D.s.maxReview;
  const backlog=dueAll().length, todayDue=dueToday().length;

  let vTitle, vBody;
  if(rr<20){
    vTitle="아직 판단하기엔 이릅니다";
    vBody="복습을 "+rr+"번 했습니다. 30번쯤 넘어가면 정답률이 의미를 갖기 시작합니다. 그때까지는 그냥 매일 하시면 됩니다.";
  }else if(racc<75){
    vTitle="너무 어렵게 가고 있습니다";

    +'둘 다 시간이 새는 것이라 이 띠 안에 두는 게 목표입니다.</p></div>';

  /* ── 얼마나 내 것이 되었나 ── */
  const tot=D.cards.length||1;
  h+='<div class="panel"><div class="h2">얼마나 내 것이 되었나</div>'

    +'이 초록이 늘어나는 게 실제 성과입니다 — 푼 카드 수는 늘어나도 초록이 안 늘면 헛돌고 있는 겁니다.</p></div>';

  /* ── 앞으로 30일 복습량 예보 ── (fcAll·peak·avg 는 위 진단에서 이미 계산했습니다) */

/* ── 관리자 ────────────────────────────────────────────────────────
   Firebase 는 "계정 목록 보기"와 "남의 계정 지우기"를 웹 키로 허용하지 않습니다.
   둘 다 서버용 비밀키가 필요한데, 그걸 이 파일에 넣으면 누구나 전체 계정을 지울 수 있습니다.
   그래서 대신 명부(/directory)를 둡니다. 로그인하면 자기 칸에 이메일과 접속 시각을 적고,
   관리자만 전체를 읽습니다. 승인 여부도 여기에 둡니다.

   아래 번호를 비워 두면 관리자 기능과 승인 절차가 모두 꺼진 채로 동작합니다. */
const ADMIN_UID = "";

const dbRoot = () => FB.dbURL.replace(/\/+$/,"");
async function dbRead(path){
  await freshToken();
  const r = await fetch(dbRoot()+"/"+path+".json?auth="+encodeURIComponent(AUTH.idToken));
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
async function dbWrite(path, value, method){
  await freshToken();
  const r = await fetch(dbRoot()+"/"+path+".json?auth="+encodeURIComponent(AUTH.idToken)+"&print=silent",
    { method: method||"PATCH", headers:{"Content-Type":"application/json"},
      body: value===undefined ? undefined : JSON.stringify(value) });
  if(!r.ok && r.status!==204) throw new Error("HTTP "+r.status);
}

/** 명부에 내 정보를 남기고 승인 상태를 확인합니다.
    규칙이 아직 없거나 읽지 못하면 막지 않습니다 — 잠겨버리는 쪽이 더 나쁩니다 */
async function ensureAccess(){
  AUTH.approved = true;
  if(!FB.ready || !AUTH.uid || !ADMIN_UID) return;
  try{
    const now = Date.now();
    let mine = null;
    try{ mine = await dbRead("directory/"+AUTH.uid); }catch(e){}
    if(!mine) await dbWrite("directory/"+AUTH.uid, {email:AUTH.email, at:now, seen:now});
    else      await dbWrite("directory/"+AUTH.uid, {email:AUTH.email, seen:now});
    /* 관리자는 자기 칸도 승인해 둡니다. 보안 규칙이 ok 를 보기 때문에
       이게 없으면 관리자 본인이 자기 단어장을 못 읽습니다 */
    if(AUTH.uid === ADMIN_UID && !(mine && mine.ok === true))
      await dbWrite("directory/"+AUTH.uid, {ok:true});
    let open = null;
    try{ open = await dbRead("config/open"); }catch(e){}
    AUTH.approved = (AUTH.uid === ADMIN_UID) || (mine && mine.ok === true) || open === true;
  }catch(e){ AUTH.approved = true; }
}

let admList = null, admOpen = false, admBusy = false, admErr = "";

async function admLoad(){
  admBusy = true; admErr = ""; render();
  try{
    const d = await dbRead("directory");
    admList = Object.entries(d||{}).map(([uid,v]) => Object.assign({uid}, v||{}))
      .sort((a,b) => (b.at||0) - (a.at||0));
    try{ admOpen = (await dbRead("config/open")) === true; }catch(e){ admOpen = false; }
  }catch(e){
    admErr = /40[13]/.test(e.message)
      ? "명부를 읽을 권한이 없습니다. 보안 규칙을 아직 안 바꾸셨거나 관리자 번호가 틀렸습니다."
      : e.message;
    admList = null;
  }
  admBusy = false; render();
}

function dataSize(){
  const t = payloadJSON();
  try{ return new Blob([t]).size; }catch(e){ return t.length; }
}
const kb = n => n < 1024 ? (n + "B") : (n/1024).toFixed(n < 10240 ? 1 : 0) + "KB";

/* ── 설정값을 앱 안에서 바로 넣고 확인할 수 있게 ──
   코드에 적어 두면 모두가 쓰고, 여기서 넣으면 이 기기에서만 먼저 써볼 수 있습니다.
   콘솔 설정을 끝낸 뒤 코드에 옮겨 적으면 다른 사람도 쓸 수 있게 됩니다. */
const FBKEY = "lexicon:fb";
(function(){
  if(FB.apiKey && FB.dbURL){ FB.ready = true; return; }
  try{
    const p = JSON.parse(localStorage.getItem(FBKEY) || "null");
    if(p && p.apiKey && p.dbURL){ FB.apiKey = p.apiKey; FB.dbURL = p.dbURL; FB.ready = true; }
  }catch(e){}
})();

/** 넣은 값이 맞는지, 콘솔 설정을 빠뜨리지 않았는지 하나씩 확인합니다 */
async function fbCheck(){
  const key = ($("#fb-key") ? $("#fb-key").value : "").trim();
  const db  = ($("#fb-db")  ? $("#fb-db").value  : "").trim().replace(/\/+$/,"");
  const rows = [];
  const ok   = t => rows.push('<div class="ok-box" style="margin-top:6px">✓ '+t+'</div>');
  const bad  = t => rows.push('<div class="warn" style="margin-top:6px">✕ '+t+'</div>');

  fbChecking = true; fbDiag = ""; render();
  try{
    /* 1. 생김새부터 */
    if(!key){ bad("apiKey 가 비어 있습니다."); }
    else if(!/^AIza/.test(key)) bad("apiKey 는 보통 <b>AIza</b> 로 시작합니다. 다른 값을 붙여넣으신 것 같습니다.");
    else ok("apiKey 형식이 맞습니다.");

    if(!db){ bad("databaseURL 이 비어 있습니다."); }
    else if(!/^https:\/\//.test(db)) bad("databaseURL 은 <b>https://</b> 로 시작해야 합니다.");
    else if(!/(firebasedatabase\.app|firebaseio\.com)$/.test(db))
      bad("databaseURL 이 <b>.firebasedatabase.app</b> 이나 <b>.firebaseio.com</b> 으로 끝나야 합니다. "
        + "Realtime Database 화면 맨 위 주소를 그대로 복사하세요. Firestore 주소가 아닙니다.");
    else ok("databaseURL 형식이 맞습니다.");

    /* 2. 로그인 쪽이 켜져 있는지 — 없는 계정으로 한 번 찔러봅니다 */
    if(key && /^AIza/.test(key)){
      try{
        const r = await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="
            + encodeURIComponent(key),
          { method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({email:"lexicon-setup-check@example.invalid",
                                  password:"checkcheck", returnSecureToken:true}) });
        const j = await r.json().catch(()=>({}));
        const m = (j.error && j.error.message) || "";
        if(/API key not valid/i.test(m)) bad("apiKey 가 이 프로젝트의 것이 아닙니다. 다시 복사해 주세요.");
        else if(/OPERATION_NOT_ALLOWED/.test(m))
          bad("<b>이메일 로그인이 꺼져 있습니다.</b> 콘솔에서 Authentication → Sign-in method → "
            + "이메일/비밀번호 를 켜주세요. (안내문 3단계)");
        else if(/INVALID_LOGIN_CREDENTIALS|EMAIL_NOT_FOUND|INVALID_PASSWORD/.test(m))
          ok("이메일 로그인이 켜져 있습니다.");
        else if(r.ok) ok("로그인 기능이 응답합니다.");
        else bad("로그인 쪽 응답이 뜻밖입니다: " + esc(m || ("HTTP "+r.status)));
      }catch(e){ bad("로그인 서버에 닿지 못했습니다. 인터넷 연결을 확인해 주세요."); }
    }

    /* 3. 데이터베이스 주소와 보안 규칙 */
    if(db && /^https:\/\//.test(db)){
      try{
        const r = await fetch(db + "/users/__setupcheck.json");
        if(r.status === 401) ok("데이터베이스가 있고 <b>보안 규칙이 걸려 있습니다.</b> 가장 좋은 상태입니다.");
        else if(r.status === 404)
          bad("그 주소에 데이터베이스가 없습니다. 주소를 다시 확인하시거나, "
            + "Realtime Database 를 아직 안 만드셨다면 먼저 만들어 주세요. (안내문 4단계)");
        else if(r.ok)
          bad("<b>데이터베이스가 아무나 읽을 수 있는 상태입니다.</b> 테스트 모드로 만드신 것 같습니다. "
            + "안내문 5단계의 보안 규칙을 넣고 게시해 주세요.");
        else bad("데이터베이스 응답이 뜻밖입니다: HTTP " + r.status);
      }catch(e){ bad("데이터베이스 주소에 닿지 못했습니다. 주소에 오타가 없는지 보세요."); }
    }

    const allOk = rows.every(x => x.indexOf("ok-box") >= 0) && rows.length >= 3;
    if(allOk && key && db){
      try{ localStorage.setItem(FBKEY, JSON.stringify({apiKey:key, dbURL:db})); }catch(e){}
      FB.apiKey = key; FB.dbURL = db; FB.ready = true;
      rows.push('<div class="ok-box" style="margin-top:10px"><b>전부 통과했습니다.</b><br>'
        + '이 기기에서 바로 로그인해 볼 수 있습니다. 다른 사람도 쓰게 하려면 '
        + '이 두 값을 코드의 <span class="mono">const FB</span> 에 옮겨 적으면 됩니다.</div>');
    }
  }catch(e){
    rows.push('<div class="warn">확인 중 오류가 났습니다: '+esc(e.message)+'</div>');
  }
  fbDiag = rows.join("");
  fbChecking = false;
  render();
}

  if(FB.ready && ADMIN_UID && AUTH.uid === ADMIN_UID)

function parseRows(text){
  const delim = text.includes("\t") ? "\t" : ",";
  const rows=[]; let f="", row=[], q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'&&text[i+1]==='"'){f+='"';i++;} else if(ch==='"') q=false; else f+=ch; }
    else if(ch==='"') q=true;
    else if(ch===delim){ row.push(f); f=""; }
    else if(ch==="\n"){ row.push(f); rows.push(row); row=[]; f=""; }
    else if(ch!=="\r") f+=ch; }
  if(f||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()));
}
let importPreview=null, importPack="";
function doPreview(){
  const raw=$("#imp").value;
  const pv=$("#imp-pack")?$("#imp-pack").value:"";
  importPack = pv==="__new" ? "" : pv;
  const rows=parseRows(raw);
  if(!rows.length){ toast("읽을 내용이 없습니다"); return; }
  const head=rows[0].map(c=>c.trim().toLowerCase());
  const body=(head[0]==="word"||head[0]==="단어")?rows.slice(1):rows;
  const have=new Set(D.cards.map(c=>c.word.toLowerCase()));
  const items=body.map(r=>({
    word:(r[0]||"").trim(), meaning:(r[1]||"").trim(), example:(r[2]||"").trim(),
    collocation:(r[3]||"").trim(), tags:(r[4]||"").split(/[;|]/).map(t=>t.trim()).filter(Boolean),
    pack:((r[5]||"").trim()||importPack), syn:(r[6]||"").trim(), ant:(r[7]||"").trim()
  })).filter(x=>x.word);
  const fresh=items.filter(x=>!have.has(x.word.toLowerCase()));
  importPreview={items, fresh, dup:items.length-fresh.length, missing:fresh.filter(x=>!x.meaning).length, raw};
  render(); $("#imp").value=raw;
}

const aiReady = () => (D.s.provider==="gemini" && D.s.geminiKey) || (D.s.provider==="anthropic" && D.s.apiKey);

/* 키는 URL이 아니라 헤더로 보냅니다.
   ?key= 방식은 2026년부터 AI Studio가 발급하는 AQ. 접두사 키에서 거부되고,
   URL에 실린 키는 서버 로그·리퍼러에 남습니다. */
const GEMINI_URL = model =>
  "https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent";
const GEMINI_HEADERS = () => ({ "content-type":"application/json", "x-goog-api-key":D.s.geminiKey });

const AI_PROMPT = words =>
  '다음 영단어들의 사전 정보를 JSON 배열로만 출력하세요. 설명이나 코드펜스 없이 배열만.\n'
  +'각 원소: {"word":"","meaning":"","example":"","collocation":""}\n'
  +'- meaning: 한국어 대표 뜻 1~3개를 쉼표로 구분\n'
  +'- example: 그 단어가 들어간 자연스러운 영어 문장 1개, 15단어 이내\n'
  +'- collocation: 그 단어와 자주 함께 쓰는 표현 2~3개를 세미콜론으로 구분\n'
  +'- 영어 단어가 아니면 meaning은 빈 문자열\n'
  +'- 입력 순서와 개수를 그대로 유지\n\n단어: '+JSON.stringify(words);

async function apiFetch(words){
  const prompt=AI_PROMPT(words);
  let txt="";
  if(D.s.provider==="gemini"){
    const model=D.s.geminiModel||"gemini-2.5-flash";
    const url=GEMINI_URL(model);
    const r=await fetch(url,{ method:"POST", headers:GEMINI_HEADERS(),
      body:JSON.stringify({ contents:[{parts:[{text:prompt}]}] }) });
    if(!r.ok){
      const t=await r.text().catch(()=>"");
      if(r.status===429) throw new Error("무료 한도 초과 — 잠시 뒤 다시 시도하세요");
      if(r.status===400||r.status===404) throw new Error("모델 이름이나 키를 확인하세요 ("+r.status+")");
      throw new Error("HTTP "+r.status+(t?" · "+t.slice(0,100):""));
    }
    const j=await r.json();
    const parts=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
    txt=parts.map(p=>p.text||"").join("");
  }else{
    const r=await fetch("https://api.anthropic.com/v1/messages",{ method:"POST", headers:{
      "content-type":"application/json", "x-api-key":D.s.apiKey,
      "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
      body:JSON.stringify({ model:D.s.model||"claude-sonnet-5", max_tokens:1200,
        messages:[{role:"user", content:prompt}] }) });
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j=await r.json();
    txt=(j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
  }
  const a=txt.indexOf("["), b=txt.lastIndexOf("]");
  if(a<0||b<0) throw new Error("응답을 읽지 못했습니다");
  return JSON.parse(txt.slice(a,b+1));
}
async function bulkFill(){
  const btn=$("#bulkbtn"); const targets=importPreview.fresh.filter(x=>!x.meaning);
  try{
    for(let i=0;i<targets.length;i+=8){
      const chunk=targets.slice(i,i+8);
      if(btn) btn.innerHTML='<span class="spin"></span>'+Math.min(i+8,targets.length)+"/"+targets.length;
      const got=await apiFetch(chunk.map(x=>x.word));
      chunk.forEach((x,j)=>{ const g=got.find(g=>(g.word||"").toLowerCase()===x.word.toLowerCase())||got[j]||{};
        if(g.meaning){ x.meaning=g.meaning; x.example=x.example||g.example||""; x.collocation=x.collocation||g.collocation||""; x.auto=true; } });
    }
    importPreview.missing=importPreview.fresh.filter(x=>!x.meaning).length;
    toast("채우기 완료. 저장 전에 뜻을 확인하세요"); render();
  }catch(e){ toast("자동 채우기 실패: "+e.message); render(); }
}

    ensureAccess().then(()=>{ render(); if(AUTH.approved){ toast("승인되었습니다"); syncNow(false); }
      else toast("아직 승인 전입니다"); });
    return; }
  if(a==="adm-load"){ admLoad(); return; }
  if(a==="adm-open"){
    const next = !admOpen;
    askYes(next?"승인 없이 바로 쓰게 할까요?":"승인을 받게 할까요?",
      next ? "가입한 사람이 기다리지 않고 바로 쓰게 됩니다. 아무나 가입할 수 있다는 뜻이기도 합니다."
           : "앞으로 가입하는 사람은 관리자가 승인해야 쓸 수 있습니다. 이미 승인된 사람은 그대로입니다.",
      next?"바로 쓰게 하기":"승인 받게 하기")
      .then(ok=>{ if(!ok) return;
        dbWrite("config", {open:next}).then(()=>{ admOpen=next; render(); toast("바꿨습니다"); })
          .catch(e=>toast("바꾸지 못했습니다: "+e.message)); });
    return; }
  if(a==="adm-ok"){
    const uid=t.dataset.u, v=t.dataset.v==="1";
    dbWrite("directory/"+uid, {ok:v}).then(()=>admLoad())
      .catch(e=>toast("바꾸지 못했습니다: "+e.message));
    return; }
  if(a==="adm-wipe"){
    const uid=t.dataset.u, em=t.dataset.e||"(이메일 없음)";
    askText("이 사람의 데이터를 지울까요?","삭제","",
      em+" 의 단어장과 명부 기록을 지우고 접근을 막습니다. 되돌릴 수 없습니다.\n"
      +"로그인 계정 자체는 Firebase 콘솔에서만 지울 수 있습니다.\n\n맞으면 \u2018삭제\u2019 라고 적어 주세요.")
      .then(v=>{
        if(String(v||"").trim()!=="삭제"){ toast("지우지 않았습니다"); return; }
        dbWrite("users/"+uid, null, "DELETE")
          .then(()=>dbWrite("directory/"+uid, null, "DELETE"))
          .then(()=>{ admLoad(); toast("지웠습니다"); })
          .catch(e=>toast("지우지 못했습니다: "+e.message)); });
    return; }
  if(a==="sync-now"){ syncNow(false); return; }
  if(a==="au-pwreset"){
    askYes("비밀번호를 바꿀까요?", AUTH.email+" 로 비밀번호를 다시 정하는 메일을 보냅니다.\n메일이 안 보이면 스팸함도 확인해 주세요.", "메일 받기")
      .then(ok=>{ if(!ok) return;
        idt("sendOobCode",{requestType:"PASSWORD_RESET", email:AUTH.email})
          .then(()=>toast("메일을 보냈습니다"))
          .catch(e=>toast(e.message)); });
    return; }
  if(a==="au-delete"){
    askYes("계정을 지울까요?","이 계정에 저장된 단어와 학습 기록이 모두 사라집니다. 되돌릴 수 없습니다.\n먼저 파일로 내보내 두는 것을 권합니다.","계정 지우기",true)
      .then(ok=>{ if(!ok) return;
        freshToken()
          .then(()=>fetch(dbPath()+"?auth="+encodeURIComponent(AUTH.idToken),{method:"DELETE"}))
          .then(()=>idt("delete",{idToken:AUTH.idToken}))
          .then(()=>{ authClear(); setSolo(false);
            D.cards=[]; D.log={}; D.packs=[]; D.del={}; D.s.ownerUid=""; D.s.pushSig="";
            save(); view="study"; render(); toast("계정을 지웠습니다"); })
          .catch(e=>toast("지우지 못했습니다: "+e.message)); });
    return; }
  if(a==="import-merge"){ importMode="merge"; $("#filein").value=""; $("#filein").click(); return; }
  if(a==="import-over"){ importMode="over"; $("#filein").value=""; $("#filein").click(); return; }
  if(a==="reset-prog"){
    askYes("학습 진도를 초기화할까요?","단어 "+D.cards.length+"개는 그대로 남고, 복습 일정과 정답률만 처음으로 돌아갑니다.","진도 초기화",true)
      .then(ok=>{ if(!ok) return;
        D.cards.forEach(c=>Object.assign(c,{ef:2.5,reps:0,step:0,interval:0,lapses:0,seen:0,correct:0,leech:false,due:sod(),updatedAt:Date.now()}));
        save(); render(); toast("진도를 초기화했습니다"); });
    return;
  }
  if(a==="reset-all"){
    askText("정말 전부 삭제할까요?","삭제","",
      "단어 "+D.cards.length+"개와 학습 기록이 모두 사라집니다. 되돌릴 수 없습니다.\n"
      +(AUTH.uid?"계정에 올라간 것도 함께 지워지고, 다른 기기에서도 사라집니다.\n":"")
      +"\n맞으면 아래 칸에 \u2018삭제\u2019 두 글자를 직접 적어 주세요.")
      .then(v=>{
        if(String(v||"").trim()!=="삭제"){ toast("지우지 않았습니다"); return; }
        /* 묘비를 남겨야 동기화로 되살아나지 않습니다 */
        const now=Date.now();
        D.cards.forEach(c=>{ D.del[(c.word||"").toLowerCase()]=now; });
        D.cards=[]; D.log={}; D.packs=[]; D.packMeta={}; importPreview=null; packPath=""; D.s.lastPack="";
        D.s.pushSig="";
        save(); render(); toast("전부 지웠습니다"); });
    return;
  }
});

function copy(text){
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>toast("복사했습니다"),()=>fallback());
  } else fallback();
  function fallback(){
    const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("복사했습니다"); }catch(e){ toast("복사가 막혔습니다"); }
    document.body.removeChild(ta);
  }
}

let importMode="over";
document.addEventListener("change", e=>{
  const k=e.target.dataset.sw;
  if(k){
    if(k==="typing") D.s.typing=e.target.checked;
    else if(k==="autospeak") D.s.autoSpeak=e.target.checked;
    else if(k==="lowdata") D.s.lowData=e.target.checked;
    else if(k.startsWith("t-")) D.s.typeModes[{"t-ko2en":"ko2en","t-spell":"spell","t-dict":"dictation"}[k]]=e.target.checked;
    save(); render(); return;
  }
  if(e.target.id==="f-pack"){
    if(e.target.value!=="__new"){ D.s.lastPack=e.target.value; save(); return; }
    const keep=readForm();
    askText("새 팩 만들기","예: 영 쉘던/S1/E02","","계층은 / 로 나눕니다.").then(name=>{
      if(name&&name.trim()) D.s.lastPack=addPack(name);
      save(); render(); writeForm(keep);
    });
    return;
  }
  if(e.target.id==="imp-pack"){
    const raw=$("#imp")?$("#imp").value:"";
    if(e.target.value!=="__new"){ importPack=e.target.value; return; }
    askText("새 팩 만들기","예: 영 쉘던/S1/E02","","계층은 / 로 나눕니다.").then(name=>{
      if(name&&name.trim()) importPack=addPack(name);
      save(); render(); if($("#imp")) $("#imp").value=raw;
    });
    return;
  }
  if(e.target.id==="s-new"){ D.s.dailyNew=Math.max(0,+e.target.value||0); save(); render(); return; }
  if(e.target.id==="s-max"){ D.s.maxReview=Math.max(0,+e.target.value||0); save(); render(); return; }
  if(e.target.id==="s-gkey"){ D.s.geminiKey=e.target.value.trim(); save(); return; }
  if(e.target.id==="s-gmodel"){ D.s.geminiModel=e.target.value.trim()||"gemini-2.5-flash"; save(); return; }
  if(e.target.id==="s-key"){ D.s.apiKey=e.target.value.trim(); save(); return; }
  if(e.target.id==="s-model"){ D.s.model=e.target.value.trim()||"claude-sonnet-5"; save(); return; }
  if(e.target.id==="s-voice"){ D.s.voiceURI=e.target.value; save(); return; }
  if(e.target.id==="csvin"){
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      let txt=new TextDecoder("utf-8").decode(new Uint8Array(rd.result));
      /* 엑셀에서 저장한 한국어 CSV 는 UTF-8 이 아닌 경우가 많습니다.
         글자가 깨졌으면(U+FFFD) 한국어 인코딩으로 다시 읽습니다 */
      if(txt.indexOf("\uFFFD")>=0){
        try{ txt=new TextDecoder("euc-kr").decode(new Uint8Array(rd.result)); }catch(err){}
      }
      const box=$("#imp");
      if(!box){ toast("단어 탭에서 다시 시도해 주세요"); return; }
      box.value=txt.replace(/^\uFEFF/,"");
      doPreview();
      toast(f.name+" 을 읽었습니다");
    };
    rd.onerror=()=>toast("파일을 읽지 못했습니다");
    rd.readAsArrayBuffer(f);
    return;
  }
  if(e.target.id==="filein"){
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{ try{ const p=JSON.parse(rd.result);
      if(!p.cards||!Array.isArray(p.cards)) throw new Error("Lexicon 백업 파일이 아닙니다");
      if(importMode==="over"){
        askYes("덮어쓸까요?","지금 단어 "+D.cards.length+"개를 지우고 백업의 "+p.cards.length+"개로 바꿉니다.","덮어쓰기",true)
          .then(ok=>{ if(!ok) return;
            /* 설정은 백업의 공개 항목만 받고, 이 기기의 토큰·키는 그대로 둡니다 */
            D={v:2, cards:p.cards, log:p.log||{}, packs:p.packs||[], del:p.del||{},
               packMeta:p.packMeta||{},
               s:{...D.s, ...publicSettings(p.s||{}),
                  typeModes:{...DEFAULTS.typeModes,...((p.s||{}).typeModes||{})}}};
            fixLoaded(); save(); render(); toast(D.cards.length+"개로 바꿨습니다"); });
      }else{
        const r=mergeData(p);
        save(); render();
        toast("새로 "+r.add+"개 추가, "+r.upd+"개 진도 갱신");
      }
    }catch(err){ toast("불러오기 실패: "+err.message); } };
    rd.readAsText(f); return;
  }
});
function readForm(){ return {word:$("#f-word")?$("#f-word").value:"", mean:$("#f-mean")?$("#f-mean").value:"",
  ex:$("#f-ex")?$("#f-ex").value:"", col:$("#f-col")?$("#f-col").value:"", tag:$("#f-tag")?$("#f-tag").value:""}; }
function writeForm(v){ if(!$("#f-word")) return;
  $("#f-word").value=v.word; $("#f-mean").value=v.mean; $("#f-ex").value=v.ex;
  $("#f-col").value=v.col; $("#f-tag").value=v.tag; }
document.addEventListener("input", e=>{
  if(e.target.id==="s-rate"){ D.s.rate=+e.target.value; save();
    e.target.previousElementSibling.textContent="속도 "+D.s.rate.toFixed(1)+"x"; }
});
let searchT;
document.addEventListener("keyup", e=>{
  if(e.target.id==="m-q"){ clearTimeout(searchT); searchT=setTimeout(()=>{ mq=e.target.value;
    const pos=e.target.selectionStart; render(); const el=$("#m-q"); if(el){ el.focus(); el.setSelectionRange(pos,pos);} },250); }
});
document.addEventListener("keydown", e=>{
  if(e.target.id==="typein"&&e.key==="Enter"){ checkTyped(); return; }
  if(e.target.id==="d-q"&&e.key==="Enter"){ e.preventDefault(); dictLook(e.target.value); return; }
  if(!S||["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName)) return;
  if(e.key==="z"||e.key==="Z"){ e.preventDefault(); undoGrade(); return; }
  if(!S.flipped&&e.code==="Space"&&!S.mode.startsWith("type_")){ e.preventDefault(); flip(); return; }
  if(S.flipped&&["1","2","3","4"].includes(e.key)){ e.preventDefault();
    const ch=gradeChoices(), i=+e.key-1;
    if(i<ch.length) grade(ch[i]); }
});

/* 스와이프 채점 */
let sx=0, sy=0, tracking=false;
document.addEventListener("touchstart", e=>{
  if(!S||!S.flipped||S.noSched||S.result) return;
  const w=e.target.closest("#flipwrap"); if(!w) return;
  sx=e.touches[0].clientX; sy=e.touches[0].clientY; tracking=true;
},{passive:true});
document.addEventListener("touchend", e=>{
  if(!tracking) return; tracking=false;
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.6) grade(dx>0?4:0);
},{passive:true});

load(); authLoad(); render(); paintSync();
if(FB.ready && AUTH.uid) ensureAccess().then(()=>{ render(); if(AUTH.approved) syncNow(true); });
document.addEventListener("visibilitychange", ()=>{
  if(!FB.ready || !AUTH.uid) return;
  if(document.visibilityState === "hidden"){
    /* 화면을 떠날 때 밀린 변경을 올려 둡니다 */
    if(savePending || syncDirty) syncNow(true);
    return;
  }
  /* 저데이터 모드에서는 돌아올 때마다 자동으로 받아오지 않습니다 */
  if(!D.s.lowData && Date.now()-(D.s.syncedAt||0) > 60000) syncNow(true);
});

window.addEventListener("beforeunload", ()=>{
  if(!savePending) return;
  try{ localStorage.setItem(KEY, JSON.stringify(D)); savePending=false; }catch(e){}
});
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
