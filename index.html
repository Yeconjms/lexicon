<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#1B2C3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lexicon">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Lexicon — 영단어 플래시카드</title>
<style>
:root{
  --paper:#EBEFF2; --card:#FFFFFF; --ink:#16232E; --muted:#5F7580; --line:#D3DCE1;
  --blue:#2A4C7D; --green:#16785A; --rose:#A6394A; --amber:#B5820E; --deep:#1B2C3A;
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI','Malgun Gothic',system-ui,sans-serif;
  --serif:'Iowan Old Style','Charter','Palatino Linotype',Georgia,'Times New Roman',serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --star:#F6DB63; --star-deep:#E9C43C; --star-ink:#1F2933; --lilac:#D9C7F0;
  --navh:62px;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink);}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
.hide{display:none!important;}

/* ── 레이아웃 ── */
#app{max-width:760px;margin:0 auto;padding:0 15px calc(var(--navh) + env(safe-area-inset-bottom) + 20px);}
.head{display:flex;align-items:center;gap:12px;padding:14px 0 4px;}
.brand{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.02em;}
.brand small{font-family:var(--sans);font-size:11px;color:var(--muted);margin-left:7px;letter-spacing:.05em;font-weight:600;}
.streak{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--amber);}

nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:rgba(255,255,255,.94);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);}
nav button{flex:1;padding:9px 0 10px;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.02em;
  display:flex;flex-direction:column;align-items:center;gap:3px;}
nav button .ic{font-size:17px;line-height:1;}
nav button.on{color:var(--blue);}
nav .badge{position:absolute;transform:translate(15px,-4px);background:var(--rose);color:#fff;
  font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 5px;border-radius:99px;}

/* ── 공용 ── */
.panel{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px;margin-top:14px;}
.h2{font-size:12px;font-weight:700;letter-spacing:.09em;color:var(--muted);text-transform:uppercase;margin:0 0 12px;}
.mono{font-family:var(--mono);} .muted{color:var(--muted);}
.note{font-size:12.5px;color:var(--muted);line-height:1.65;margin:8px 0 0;}
.warn{background:rgba(181,130,14,.1);border:1px solid rgba(181,130,14,.32);color:#7A5806;
  border-radius:9px;padding:10px 12px;font-size:12.5px;line-height:1.6;margin-top:10px;}
.ok{color:var(--green);font-weight:600;}
.ok-box{background:rgba(22,120,90,.1);border:1px solid rgba(22,120,90,.3);color:#0E5C44;
  border-radius:9px;padding:10px 12px;font-size:12.5px;line-height:1.6;margin-top:10px;}
.linkish{background:none;border:0;padding:5px 2px;color:var(--blue);font-family:inherit;
  font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
.btn{padding:11px 17px;border-radius:9px;font-size:14.5px;font-weight:600;background:var(--deep);color:#fff;}
.btn:active{opacity:.8;}
.btn[disabled]{opacity:.38;pointer-events:none;}
.btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--line);}
.btn.sm{padding:7px 12px;font-size:12.5px;}
.btn.wide{width:100%;text-align:center;}
.field{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;}
.field:focus{border-color:var(--blue);outline:none;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.chip{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(42,76,125,.09);color:var(--blue);}
.chip.rev{background:rgba(181,130,14,.15);color:#7A5806;}
.seg{display:flex;background:var(--paper);border-radius:9px;padding:3px;gap:3px;}
.seg button{flex:1;padding:8px 6px;font-size:13px;font-weight:600;color:var(--muted);border-radius:7px;}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);}
label.sw{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;}
label.sw:last-of-type{border-bottom:none;}
label.sw input{width:19px;height:19px;flex-shrink:0;accent-color:var(--blue);}
label.sw b{display:block;font-size:14.5px;font-weight:600;}
label.sw span{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5;}

/* ── 렉시(마스코트 · 별) ── */
.lexi{display:block;margin:0 auto;width:128px;height:128px;overflow:visible;}
.lexi.sm{width:44px;height:44px;margin:0;}
.st-halo{fill:none;stroke:var(--card);stroke-width:12;stroke-linejoin:round;stroke-linecap:round;}
.st-fill{fill:var(--star);}
.st-ink{fill:none;stroke:var(--star-ink);stroke-width:2.7;stroke-linejoin:round;stroke-linecap:round;}
.st-ink2{fill:none;stroke:var(--star-ink);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;opacity:.45;}
.st-limb{fill:none;stroke:var(--star-ink);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;}
.st-eye{fill:var(--star-ink);}
.st-spark{fill:var(--star-deep);opacity:0;transform-origin:center;}
.st-eyes{transform-origin:60px 50px;animation:lxblink 5.6s infinite;}
@keyframes lxblink{0%,93%,100%{transform:scaleY(1);}96%{transform:scaleY(.08);}}
.lexi.bob{animation:lxbob 1.5s ease-in-out infinite;}
@keyframes lxbob{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-8px) rotate(-5deg);}}
.lexi.pop{animation:lxpop .5s cubic-bezier(.34,1.56,.64,1);}
@keyframes lxpop{0%{transform:scale(.55) rotate(-12deg);}100%{transform:scale(1) rotate(0deg);}}
.lexi.cheer{animation:lxcheer .9s ease-in-out 2;}
@keyframes lxcheer{0%,100%{transform:translateY(0) rotate(0deg);}25%{transform:translateY(-10px) rotate(9deg);}75%{transform:translateY(-10px) rotate(-9deg);}}
.lexi.shine .st-spark{animation:lxshine 2.6s ease-in-out infinite;}
.lexi.shine .st-spark:nth-of-type(2){animation-delay:.5s;}
.lexi.shine .st-spark:nth-of-type(3){animation-delay:1.1s;}
.lexi.shake{animation:lxshake .55s ease-in-out infinite;}
@keyframes lxshake{0%,100%{transform:translateX(0) rotate(0)}
  25%{transform:translateX(-3px) rotate(-5deg)}75%{transform:translateX(3px) rotate(5deg)}}
.lexi.boom{animation:lxboom 1.1s ease-in-out infinite;}
@keyframes lxboom{0%,100%{transform:scale(1) rotate(0)}
  38%{transform:scale(1.16) rotate(-7deg)}54%{transform:scale(.93) rotate(6deg)}
  72%{transform:scale(1.09) rotate(-3deg)}}
.lexi.cheerloop{animation:lxcheer 1.4s ease-in-out infinite;}

/* 통계 탭 머리 — 복습 상태를 별 표정으로 */
.moodbox{text-align:center;}
.moodart{position:relative;display:inline-block;}
.moodt{margin:12px 0 3px;font-size:19px;font-weight:700;}
.moods{margin:0;color:var(--muted);font-size:13.5px;line-height:1.65;}
.ministars{position:absolute;inset:-10px;pointer-events:none;}
.ministar{position:absolute;color:var(--star-deep);font-size:18px;
  animation:lxtwinkle 1.9s ease-in-out infinite;text-shadow:0 1px 0 rgba(0,0,0,.12);}
.ministar:nth-child(1){left:-2px;top:10px;}
.ministar:nth-child(2){right:0;top:22px;}
.ministar:nth-child(3){left:8px;bottom:14px;}
.ministar:nth-child(4){right:10px;bottom:4px;}
.ministar:nth-child(5){left:50%;top:-6px;margin-left:-9px;font-size:22px;}
@keyframes lxtwinkle{0%,100%{opacity:.3;transform:scale(.78)}50%{opacity:1;transform:scale(1.18)}}
.boomfx{position:absolute;inset:-14px;pointer-events:none;}
.boomfx i{position:absolute;width:7px;height:7px;border-radius:99px;background:var(--rose);
  opacity:0;animation:lxburst 1.1s ease-out infinite;}
.boomfx i:nth-child(1){left:6%;top:16%;animation-delay:0ms}
.boomfx i:nth-child(2){right:4%;top:26%;animation-delay:140ms}
.boomfx i:nth-child(3){left:14%;bottom:18%;animation-delay:280ms}
.boomfx i:nth-child(4){right:12%;bottom:8%;animation-delay:420ms}
.boomfx i:nth-child(5){left:48%;top:0;animation-delay:560ms}
@keyframes lxburst{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.25)}
  100%{opacity:0;transform:scale(.5) translateY(-16px)}}

/* 유의어 · 반의어 */
.sa{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:9px;}
.sa b{font-size:11px;font-weight:700;letter-spacing:.06em;opacity:.75;}
.sa .syn{background:rgba(22,120,90,.16);color:#7FD8BC;}
.sa .ant{background:rgba(166,57,74,.18);color:#F0A9B4;}
.sa span{padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;}

/* 단어 목록 다중 필터 */
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px;}
.fchip{padding:6px 11px;border-radius:99px;font-size:12.5px;font-weight:600;
  border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;}
.fchip.on{color:#fff;border-color:transparent;}
.fchip.c-rev.on{background:var(--amber);}
.fchip.c-leech.on{background:var(--rose);}
.fchip.c-susp.on{background:var(--muted);}
.fchip.c-none.on{background:#7A5806;}
.fchip.c-tag.on{background:var(--blue);}
.fchip.c-rev{border-color:rgba(181,130,14,.45);color:#7A5806;}
.fchip.c-leech{border-color:rgba(166,57,74,.4);color:var(--rose);}
.fchip.c-tag{border-color:rgba(42,76,125,.32);color:var(--blue);}

/* 팩 색 · 아이콘 */
.swatches{display:flex;flex-wrap:wrap;gap:7px;}
.swatch{width:32px;height:32px;border-radius:9px;border:2px solid transparent;cursor:pointer;padding:0;}
.swatch.on{border-color:var(--ink);}
.swatch.none{background:var(--card);border:1px dashed var(--line);color:var(--muted);font-size:14px;}
.swatch.none.on{border:2px solid var(--ink);}
.iconbtn{min-width:40px;height:36px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);font-size:17px;line-height:1;cursor:pointer;padding:0 6px;color:var(--muted);}
.iconbtn.on{border-color:var(--ink);background:var(--paper);}
.packbar{width:5px;border-radius:99px;flex:0 0 5px;align-self:stretch;min-height:36px;}
@keyframes lxshine{0%,100%{opacity:0;transform:scale(.5) rotate(0deg);}45%{opacity:1;transform:scale(1) rotate(35deg);}}

/* ── 채점할 때 아기 별이 통통 튀어나옵니다 ── */
.burst{position:fixed;left:0;right:0;bottom:calc(var(--navh) + 22px);z-index:60;
  display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;}
.burst .lexi{width:78px;height:78px;animation:lxpush .52s cubic-bezier(.4,0,.3,1);}
@keyframes lxpush{0%{transform:scale(1,1);}26%{transform:scale(1.18,.8);}58%{transform:scale(.9,1.14);}100%{transform:scale(1,1);}}
.bstars{display:flex;gap:7px;background:rgba(255,255,255,.9);border:1px solid var(--line);
  border-radius:99px;padding:7px 13px;backdrop-filter:blur(6px);}
.bstar{font-size:22px;line-height:1;color:var(--line);}
.bstar.on{color:var(--star-deep);animation:bpop .44s cubic-bezier(.34,1.56,.64,1) backwards;}
@keyframes bpop{0%{transform:translateY(16px) scale(.2);opacity:0;}
  58%{transform:translateY(-7px) scale(1.3);opacity:1;}100%{transform:translateY(0) scale(1);opacity:1;}}
.burst.out{animation:bfade .32s ease forwards;}
@keyframes bfade{to{opacity:0;transform:translateY(10px);}}

/* ── 오늘 목표 링 ── */
.goal{display:flex;align-items:center;gap:16px;}
.ring{flex:0 0 auto;width:88px;height:88px;}
.ring .rbg{fill:none;stroke:var(--line);stroke-width:9;}
.ring .rfg{fill:none;stroke:var(--blue);stroke-width:9;stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:50% 50%;}
.ring text{font-family:var(--mono);font-weight:700;fill:var(--ink);}
.goaltext b{display:block;font-size:16px;font-weight:700;line-height:1.4;}
.goaltext span{display:block;font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:3px;}
.combo{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--star-deep);}

/* ── 통계 ── */
.diag b{display:block;font-family:var(--serif);font-size:20px;line-height:1.4;}
.diag p{margin:7px 0 0;font-size:13px;color:var(--muted);line-height:1.7;}
.bignum{font-family:var(--mono);font-size:40px;font-weight:700;line-height:1;}
.gauge{position:relative;height:11px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:12px;}
.gauge .band{position:absolute;top:0;bottom:0;background:rgba(22,120,90,.28);}
.gauge i{position:absolute;top:0;bottom:0;left:0;border-radius:99px;}
.gauge u{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--ink);border-radius:2px;}
.mixbar{display:flex;height:15px;border-radius:99px;overflow:hidden;background:var(--line);}
.mixbar i{display:block;height:100%;}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted);}
.legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
.legend em{font-style:normal;font-family:var(--mono);font-weight:700;color:var(--ink);}

/* ── 설정 접기 ── */
details.set{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-top:12px;}
details.set>summary{list-style:none;cursor:pointer;padding:15px 17px;display:flex;align-items:baseline;gap:9px;}
details.set>summary::-webkit-details-marker{display:none;}
details.set>summary strong{font-size:14.5px;font-weight:700;}
details.set>summary span{font-size:12px;color:var(--muted);}
details.set>summary::after{content:"▾";margin-left:auto;color:var(--muted);font-size:12px;
  align-self:center;transition:transform .2s;}
details.set[open]>summary::after{transform:rotate(180deg);}
details.set .inner{padding:0 17px 18px;border-top:1px solid var(--line);margin-top:2px;padding-top:15px;}
@media (prefers-reduced-motion:reduce){ .lexi,.st-eyes,.bstar,.burst{animation:none!important;} }

/* ── 사전 ── */
.dsearch{display:flex;gap:8px;align-items:stretch;}
.dsearch .field{flex:1 1 auto;min-width:0;font-family:var(--serif);font-size:17px;}
.dsearch .btn{flex:0 0 auto;white-space:nowrap;}
.dhead{display:flex;align-items:flex-start;gap:10px;}
.dword{font-family:var(--serif);font-size:clamp(26px,7.5vw,36px);line-height:1.12;word-break:break-word;}
.dipa{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:5px;}
.dsense{border-top:1px solid var(--line);padding-top:14px;margin-top:14px;}
.dsense.first{border-top:none;padding-top:0;margin-top:14px;}
.dsrow{display:flex;align-items:center;gap:8px;}
.dko{font-size:16.5px;font-weight:700;line-height:1.45;margin-top:7px;}
.den{font-family:var(--serif);font-size:14px;color:var(--muted);line-height:1.6;margin-top:6px;}
.dex{background:var(--paper);border-radius:9px;padding:10px 12px;margin-top:10px;}
.dex b{display:block;font-family:var(--serif);font-size:14.5px;font-weight:500;line-height:1.55;}
.dex span{display:block;font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5;}
.dadd{flex:0 0 auto;width:36px;height:36px;border-radius:99px;background:var(--blue);color:#fff;
  font-size:20px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;line-height:1;}
.dadd.done{background:var(--green);font-size:16px;}
.dnear{font-size:13px;color:var(--muted);line-height:1.7;margin-top:8px;}
.dnear b{font-family:var(--serif);font-weight:600;color:var(--ink);}
.drecent{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.drecent button{font-family:var(--serif);font-size:14px;padding:6px 12px;border-radius:99px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);}
.dcache{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.6;}
.speak.dark{margin-top:0;flex:0 0 auto;border-color:var(--line);color:var(--blue);background:var(--paper);}

/* ── 플래시카드 ── */
.stagehead{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 10px;
  font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);}
.flipwrap{display:grid;perspective:1400px;touch-action:pan-y;}
.face{position:relative;grid-area:1/1;background:var(--deep);border-radius:18px;color:#E8EDF1;
  padding:34px 22px;min-height:44vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  transition:transform .42s cubic-bezier(.4,.05,.2,1);cursor:pointer;}
.front{transform:rotateY(0deg);}
.back{transform:rotateY(180deg);background:#22394B;}
.flipped .front{transform:rotateY(-180deg);}
.flipped .back{transform:rotateY(0deg);}
.word{font-family:var(--serif);font-size:clamp(32px,9vw,50px);line-height:1.08;color:#fff;word-break:break-word;}
.wordko{font-size:clamp(20px,5.5vw,28px);font-weight:600;line-height:1.4;color:#fff;}
.sub{font-size:14px;color:#9DB2BF;line-height:1.65;max-width:420px;margin-top:14px;}
.sub em{font-style:normal;color:#F0C674;font-family:var(--serif);}
.sub.ex{font-family:var(--serif);font-size:15.5px;color:#CFE0EB;}
.hint{font-size:11.5px;color:#7E96A6;letter-spacing:.06em;margin-top:20px;font-weight:600;}
.speak{width:44px;height:44px;border-radius:99px;border:1px solid rgba(255,255,255,.24);
  display:inline-flex;align-items:center;justify-content:center;color:#CFE0EB;font-size:17px;margin-top:18px;}
.speak:active{background:rgba(255,255,255,.12);}
.speak.corner{position:absolute;top:12px;right:12px;margin:0;width:40px;height:40px;}
.typein{width:100%;max-width:340px;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.26);
  background:rgba(255,255,255,.07);color:#fff;font-family:var(--serif);font-size:21px;text-align:center;margin-top:18px;}
.typein::placeholder{color:#7E96A6;font-family:var(--sans);font-size:14px;}
.verdict{font-size:14px;font-weight:700;margin-top:10px;}
.v-ok{color:#8FD7BB;} .v-no{color:#F0A3AC;} .v-typo{color:#F0C674;}

/* 간격 레일 */
.rail{position:relative;height:30px;margin:12px 2px 0;}
.railline{position:absolute;top:14px;left:0;right:0;height:1px;background:var(--line);}
.tick{position:absolute;top:9px;width:1px;height:10px;background:#C3CFD6;}
.ticklab{position:absolute;top:20px;transform:translateX(-50%);font-family:var(--mono);font-size:9px;color:var(--muted);}
.dot{position:absolute;top:9px;width:10px;height:10px;border-radius:99px;transform:translateX(-50%);
  transition:left .5s cubic-bezier(.4,0,.2,1);}
.dot.now{background:var(--amber);box-shadow:0 0 0 3px rgba(181,130,14,.18);}
.dot.gh{width:6px;height:6px;top:11px;background:#B6C4CD;}

/* 채점 */
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px;}
.grade{padding:16px 3px;border-radius:11px;background:var(--card);border:1px solid var(--line);text-align:center;}
.grade:active{background:#E3E9ED;}
.grade b{display:block;font-size:14.5px;font-weight:700;}
.grade i{display:block;font-style:normal;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px;}
.grade.g0{border-color:rgba(166,57,74,.4);} .grade.g0 b{color:var(--rose);}
.grade.g5{border-color:rgba(22,120,90,.4);} .grade.g5 b{color:var(--green);}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:12px;}
.prog i{display:block;height:100%;background:var(--blue);transition:width .3s;}

/* 목록 */
.item{border-bottom:1px solid var(--line);padding:12px 0;}
.item:last-child{border-bottom:none;}
.itemw{font-family:var(--serif);font-size:17.5px;font-weight:600;}
.itemm{font-size:13.5px;color:var(--muted);margin-top:2px;}
.itemex{font-family:var(--serif);font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5;}
.meta{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:5px;}

/* 통계 */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 7px;
  min-width:0;text-align:center;}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-weight:700;line-height:1;}
/* 라벨이 좁은 화면에서 두 줄로 접히면 칸 높이가 들쭉날쭉해집니다. 한 줄로 고정하고 폭에 맞춰 줄입니다 */
.stat span{display:block;font-size:clamp(9px,2.7vw,11px);color:var(--muted);margin-top:5px;
  font-weight:600;white-space:nowrap;}
.heat{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px;}
.heat .col{display:flex;flex-direction:column;gap:3px;}
.cell{width:11px;height:11px;border-radius:2px;background:#DCE3E8;flex-shrink:0;}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;}
.fc{display:flex;align-items:flex-end;gap:2px;height:70px;}
.fcbar{flex:1;height:100%;display:flex;align-items:flex-end;}
.fcbar i{display:block;width:100%;border-radius:2px 2px 0 0;min-height:1px;}
.bar i{display:block;height:100%;}

.empty{text-align:center;padding:42px 16px;}
.empty h3{font-family:var(--serif);font-size:23px;margin:0 0 8px;font-weight:600;}
.empty p{color:var(--muted);font-size:14px;margin:0 0 18px;line-height:1.65;}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:99px;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px;}
@keyframes sp{to{transform:rotate(360deg);}}
.modal{position:fixed;inset:0;z-index:200;background:rgba(20,33,43,.5);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .16s ease-out;}
.mbox{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:400px;
  box-shadow:0 18px 50px rgba(0,0,0,.28);animation:pop .18s cubic-bezier(.2,.8,.3,1);}
.mtitle{font-size:16.5px;font-weight:700;line-height:1.4;}
.btn.danger{background:var(--rose);}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:calc(var(--navh) + 18px);transform:translateX(-50%);z-index:99;
  background:var(--deep);color:#fff;font-size:13.5px;font-weight:600;padding:10px 18px;border-radius:99px;
  box-shadow:0 6px 20px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

@media(min-width:641px){
  :root{--navh:0px;}
  nav{position:static;background:none;border:none;backdrop-filter:none;justify-content:flex-end;padding:0;margin-left:auto;}
  nav button{flex:0 0 auto;flex-direction:row;gap:6px;padding:7px 11px;font-size:13.5px;border-radius:8px;}
  nav button .ic{font-size:14px;}
  nav button.on{background:var(--deep);color:#fff;}
  nav .badge{position:static;transform:none;}
  .head{flex-wrap:wrap;}
  #app{padding-bottom:60px;}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

<body>

<div id="app">
  <header class="head">

</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ══════════════════ 상수 · 유틸 ══════════════════ */
const DAY = 86400000, KEY = "lexicon:v1";
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const dayKey = (d=new Date()) => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const sod = (t=Date.now()) => { const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const fmtD = t => { const d=new Date(t); return (d.getMonth()+1)+"/"+d.getDate(); };
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const norm = s => (s||"").toLowerCase().trim().replace(/[.,!?;:'"]/g,"").replace(/\s+/g," ");
function lev(a,b){ if(a===b)return 0; const m=a.length,n=b.length; if(!m)return n; if(!n)return m;
  let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const c=[i];
    for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));
    p=c; } return p[n]; }
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200); }

/* 채점 품질을 별 개수로 돌려줍니다. 모름 1 · 애매 3 · 알아 4 · 쉬움 5 */
const STARS_FOR = q => q>=5?5 : q>=4?4 : q>=3?3 : 1;
let burstT=null;
/** 채점 직후 잠깐 떠오르는 별 연출. 다음 카드를 막지 않도록 클릭을 통과시킵니다 */
function starBurst(n){
  const old=$("#burst"); if(old) old.remove();
  clearTimeout(burstT);
  const w=document.createElement("div");
  w.className="burst"; w.id="burst";
  w.innerHTML = lexi(n>=4?"happy":"push","")
    +'<div class="bstars">'
    + [0,1,2,3,4].map(i=>'<span class="bstar'+(i<n?" on":"")+'"'
        +(i<n?' style="animation-delay:'+(90+i*95)+'ms"':'')+'>★</span>').join("")
    +'</div>';
  document.body.appendChild(w);
  burstT=setTimeout(()=>{ w.classList.add("out"); setTimeout(()=>w.remove(),340); }, 380+n*95+320);
}

/** 브라우저 기본 prompt/confirm 은 환경에 따라 차단되므로 앱 자체 대화창을 씁니다 */
function modal(o){
  return new Promise(res=>{
    const w=document.createElement("div");
    w.className="modal";
    w.innerHTML='<div class="mbox">'
      +'<div class="mtitle">'+esc(o.title)+'</div>'
      +(o.message?'<p class="note" style="margin:7px 0 0;white-space:pre-line">'+esc(o.message)+'</p>':'')
      +(o.input?'<input class="field" id="mval" style="margin-top:13px" autocapitalize="off" placeholder="'+esc(o.placeholder||"")+'" value="'+esc(o.value||"")+'">':'')
      +'<div class="row" style="justify-content:flex-end;margin-top:15px">'
      +'<button class="btn ghost" data-m="0">취소</button>'
      +'<button class="btn'+(o.danger?" danger":"")+'" data-m="1">'+esc(o.ok||"확인")+'</button>'
      +'</div></div>';
    document.body.appendChild(w);
    const inp=w.querySelector("#mval");
    if(inp) setTimeout(()=>{ inp.focus(); inp.select(); },60);
    function close(v){ w.remove(); document.removeEventListener("keydown",key,true); res(v); }
    function key(e){
      if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); close(null); }
      else if(e.key==="Enter"){ e.preventDefault(); e.stopPropagation(); close(inp?inp.value:true); }
    }
    document.addEventListener("keydown",key,true);
    w.addEventListener("click",e=>{
      e.stopPropagation();
      if(e.target===w){ close(null); return; }
      const b=e.target.closest("[data-m]"); if(!b) return;
      close(b.dataset.m==="1" ? (inp?inp.value:true) : null);
    });
  });
}
const askText = (title,placeholder,value,message) => modal({title,placeholder,value,message,input:true});
const askYes  = (title,message,ok,danger) => modal({title,message,ok:ok||"확인",danger}).then(v=>v===true);

/* ── 기기 식별 · 기록 합산 ──
   같은 날 폰과 PC에서 각각 공부하면 두 기록은 더해져야 합니다.
   기기마다 칸을 나눠 합산하므로 어느 쪽 기록도 다른 쪽을 덮어쓰지 않습니다. */
const DEVKEY = "lexicon:dev";
const DEV = (function(){ try{
    var d = localStorage.getItem(DEVKEY);
    if(!d){ d = Math.random().toString(36).slice(2,8); localStorage.setItem(DEVKEY, d); }
    return d;
  }catch(e){ return "local"; } })();

/** 하루치 합계 — 모든 기기의 칸을 더합니다 */
function dayStat(k){
  const row = D.log[k], out = {reviews:0, correct:0, newSeen:0};
  if(!row) return out;
  for(const dev in row){ const v = row[dev] || {};
    out.reviews += v.r||0; out.correct += v.c||0; out.newSeen += v.n||0; }
  return out;
}
/** 이 기기 칸에만 더합니다 */
function bumpDay(k, dr, dc, dn){
  const row = D.log[k] || (D.log[k] = {});
  const v = row[DEV] || (row[DEV] = {r:0, c:0, n:0});
  v.r += dr; v.c += dc; v.n += dn;
}
/** 기기 구분이 없던 예전 형식을 기기별 형식으로 바꿉니다 */
const normRow = row => (row && (typeof row.reviews === "number" || typeof row.correct === "number"))
  ? { old:{ r:row.reviews||0, c:row.correct||0, n:row.newSeen||0 } } : row;
function migrateLog(){ for(const k in D.log) D.log[k] = normRow(D.log[k]); }

/** 카드를 고친 시각을 남깁니다. 기기 간 병합에서 어느 쪽이 최신인지 가리는 기준입니다 */
const touch = c => { if(c) c.updatedAt = Date.now(); return c; };
/** 병합할 때 한 번에 옮기는 칸. 스케줄러를 바꿀 때 여기만 고치면 됩니다 */
const CARD_STATE = ["ef","reps","step","st","interval","lapses","lapseIvl","due","seen","correct","susp","leech"];

/* ══════════════════ 데이터 ══════════════════ */
const DEFAULTS = {
  front:"en",            // en | ko | mix
  typing:false,          // 타이핑 문제 섞기
  typeModes:{ko2en:true, spell:true, dictation:false},
  dailyNew:15, maxReview:100,
  lowData:false,
  autoSpeak:true, rate:0.9, voiceURI:"", lastPack:"",
  ownerUid:"", pushSig:"", syncedAt:0,
  provider:"none",                              // none | gemini | anthropic
  geminiKey:"", geminiModel:"gemini-2.5-flash",
  apiKey:"", model:"claude-sonnet-5"
};
/* 백업 파일이나 화면에 절대 섞여 나가면 안 되는 값들 */
const SECRET_KEYS = ["pushSig","geminiKey","apiKey"];
const publicSettings = s => {
  const o = {...(s||{})};
  SECRET_KEYS.forEach(k => delete o[k]);
  return o;
};
let D = { v:2, cards:[], log:{}, packs:[], del:{}, packMeta:{}, s:{...DEFAULTS} };
let view = "study";

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const p=JSON.parse(raw);
      D={ v:2, cards:p.cards||[], log:p.log||{}, packs:p.packs||[], del:p.del||{},
          packMeta:p.packMeta||{},
          s:{...DEFAULTS,...(p.s||{}), typeModes:{...DEFAULTS.typeModes,...((p.s||{}).typeModes||{})}} };
      fixLoaded(); }
  }catch(e){ toast("저장된 데이터를 읽지 못했습니다"); }
}
/** 빠진 칸을 채웁니다. 저장소에서 읽을 때와 백업 파일을 넣을 때 모두 같은 길을 씁니다 */
function fixLoaded(){
  D.cards.forEach(c=>{ if(c.step===undefined) c.step=0; if(c.pack===undefined) c.pack="";
    if(c.susp===undefined) c.susp=false; if(c.leech===undefined) c.leech=false;
    if(c.updatedAt===undefined) c.updatedAt=c.createdAt||0;
    if(c.lapseIvl===undefined) c.lapseIvl=0;
    if(c.syn===undefined) c.syn="";
    if(c.ant===undefined) c.ant="";
    if(c.st===undefined) c.st=cardSt(c); });
  migrateLog(); syncPacks();
}
let saveT, savePending=false;
function save(){ savePending=true; clearTimeout(saveT); saveT=setTimeout(()=>{
  try{ localStorage.setItem(KEY, JSON.stringify(D)); savePending=false; }
  catch(e){ toast("저장 실패 — 저장 공간을 확인하세요"); }
},250); scheduleSync(); }

/* ══════════════════ 로그인과 계정별 저장 (Firebase) ══════════════════
   Firebase 콘솔에서 받은 값 두 개를 아래에 적으면 로그인이 켜집니다.
   둘 다 비밀값이 아닙니다 — 공개되어도 됩니다. 데이터는 보안 규칙이 지킵니다.
   비워 두면 로그인 없이 이 기기에서만 쓰는 상태로 동작합니다. */
const FB = {
  /* 프로젝트 설정 → 일반 → 내 앱 → SDK 설정 및 구성 에서 그대로 옮겨 적은 값입니다.
     비밀값이 아닙니다 — 공개되어도 됩니다. 데이터는 Realtime Database 보안 규칙이 지킵니다. */
  apiKey: "AIzaSyCnnJrIAARW-8i-jcvQXgZPzUwpuApCfUA",
  dbURL : "https://lexicon-e396e-default-rtdb.asia-southeast1.firebasedatabase.app",
  ready : false
};
FB.ready = !!(FB.apiKey && FB.dbURL);

const AKEY = "lexicon:auth", SOLOKEY = "lexicon:solo";
let AUTH = { uid:"", email:"", idToken:"", refreshToken:"", expires:0,
             mode:"in", busy:false, err:"", note:"" };

const isSolo = () => { try{ return localStorage.getItem(SOLOKEY)==="1"; }catch(e){ return false; } };
const setSolo = v => { try{ v ? localStorage.setItem(SOLOKEY,"1") : localStorage.removeItem(SOLOKEY); }catch(e){} };

function authLoad(){
  try{
    const p = JSON.parse(localStorage.getItem(AKEY)||"null");
    if(p && p.refreshToken) Object.assign(AUTH, { uid:p.uid||"", email:p.email||"",
      idToken:p.idToken||"", refreshToken:p.refreshToken, expires:p.expires||0 });
  }catch(e){}
}
function authSave(){
  try{ localStorage.setItem(AKEY, JSON.stringify({ uid:AUTH.uid, email:AUTH.email,
    idToken:AUTH.idToken, refreshToken:AUTH.refreshToken, expires:AUTH.expires })); }catch(e){}
}
function authClear(){
  Object.assign(AUTH, { uid:"", email:"", idToken:"", refreshToken:"", expires:0, err:"", note:"" });
  try{ localStorage.removeItem(AKEY); }catch(e){}
}

/* 2023-09 이후 만든 프로젝트는 "이메일이 있는지"를 숨깁니다. 그래서 비밀번호가 틀린 것과
   없는 이메일을 구분할 수 없고, 둘 다 INVALID_LOGIN_CREDENTIALS 로 옵니다. */
const FB_ERR = {
  INVALID_LOGIN_CREDENTIALS:"이메일 또는 비밀번호가 맞지 않습니다",
  INVALID_PASSWORD:"이메일 또는 비밀번호가 맞지 않습니다",
  EMAIL_NOT_FOUND:"이메일 또는 비밀번호가 맞지 않습니다",
  EMAIL_EXISTS:"이미 가입된 이메일입니다. 로그인해 주세요",
  WEAK_PASSWORD:"비밀번호는 6자 이상이어야 합니다",
  INVALID_EMAIL:"이메일 형식이 올바르지 않습니다",
  MISSING_EMAIL:"이메일을 입력해 주세요",
  MISSING_PASSWORD:"비밀번호를 입력해 주세요",
  TOO_MANY_ATTEMPTS_TRY_LATER:"시도가 너무 많습니다. 잠시 뒤 다시 해주세요",
  OPERATION_NOT_ALLOWED:"이메일 로그인이 꺼져 있습니다. Firebase 콘솔에서 켜주세요",
  USER_DISABLED:"정지된 계정입니다",
  TOKEN_EXPIRED:"로그인이 만료되었습니다. 다시 로그인해 주세요",
  INVALID_ID_TOKEN:"로그인이 만료되었습니다. 다시 로그인해 주세요"
};
function fbErrKo(msg){
  const k = String(msg||"").split(" :")[0].trim();
  if(FB_ERR[k]) return FB_ERR[k];
  if(/API key not valid/i.test(msg)) return "Firebase 설정값(apiKey)이 올바르지 않습니다";
  return "오류: " + msg;
}

async function idt(path, body){
  const r = await fetch("https://identitytoolkit.googleapis.com/v1/accounts:"+path
      + "?key=" + encodeURIComponent(FB.apiKey),
    { method:"POST",
      headers:{ "Content-Type":"application/json", "X-Firebase-Locale":"ko" },
      body: JSON.stringify(body) });
  let j = {};
  try{ j = await r.json(); }catch(e){}
  if(!r.ok) throw new Error(fbErrKo((j.error && j.error.message) || ("HTTP " + r.status)));
  return j;
}
function authAdopt(j){
  AUTH.uid     = j.localId || AUTH.uid;
  AUTH.email   = j.email || AUTH.email;
  AUTH.idToken = j.idToken;
  AUTH.refreshToken = j.refreshToken;
  AUTH.expires = Date.now() + (+(j.expiresIn || 3600) * 1000);
  authSave();
}
/** 만료가 가까우면 토큰을 새로 받습니다. 토큰은 1시간짜리입니다 */
async function freshToken(){
  if(!AUTH.refreshToken) throw new Error("로그인이 필요합니다");
  if(AUTH.idToken && Date.now() < AUTH.expires - 300000) return;
  const r = await fetch("https://securetoken.googleapis.com/v1/token?key=" + encodeURIComponent(FB.apiKey),
    { method:"POST",
      headers:{ "Content-Type":"application/x-www-form-urlencoded" },
      body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(AUTH.refreshToken) });
  let j = {};
  try{ j = await r.json(); }catch(e){}
  if(!r.ok){ authClear(); throw new Error("로그인이 만료되었습니다. 다시 로그인해 주세요"); }
  AUTH.idToken      = j.id_token;
  AUTH.refreshToken = j.refresh_token || AUTH.refreshToken;
  AUTH.uid          = j.user_id || AUTH.uid;
  AUTH.expires      = Date.now() + (+(j.expires_in || 3600) * 1000);
  authSave();
}

/* ── 계정별 저장소 (Realtime Database) ──
   데이터는 JSON "문자열 하나"로 넣습니다. 그대로 트리로 넣으면 빈 배열이 사라지고
   cards 배열이 객체로 바뀌어 돌아옵니다. 문자열이면 그런 변형이 없습니다. */
const dbPath = () => FB.dbURL.replace(/\/+$/,"") + "/users/" + AUTH.uid + "/blob.json";

async function dbGet(){
  const r = await fetch(dbPath() + "?auth=" + encodeURIComponent(AUTH.idToken),
    { headers:{ "X-Firebase-ETag":"true" } });
  if(r.status===401 || r.status===403) throw new Error("로그인이 만료되었습니다. 다시 로그인해 주세요");
  if(!r.ok) throw new Error("데이터를 받지 못했습니다 (" + r.status + ")");
  const etag = r.headers.get("ETag") || "";
  const txt  = await r.text();
  let raw = null;
  try{ raw = JSON.parse(txt); }catch(e){}
  let json = null;
  if(typeof raw === "string" && raw){ try{ json = JSON.parse(raw); }catch(e){} }
  return { raw: (typeof raw === "string" ? raw : null), json, etag };
}
/** 받아온 뒤 다른 기기가 먼저 썼으면 412 가 옵니다. 그때는 다시 받아서 합칩니다 */
async function dbPut(body, etag){
  const r = await fetch(dbPath() + "?auth=" + encodeURIComponent(AUTH.idToken) + "&print=silent",
    { method:"PUT",
      headers:{ "Content-Type":"application/json", "if-match": etag || "null_etag" },
      body: JSON.stringify(body) });
  if(r.status === 412) return { conflict:true };
  if(r.status===401 || r.status===403) throw new Error("로그인이 만료되었습니다. 다시 로그인해 주세요");
  if(!r.ok && r.status !== 204) throw new Error("저장하지 못했습니다 (" + r.status + ")");
  return { ok:true };
}

/* ── 로그인 동작 ── */
async function authDo(){
  const em = ($("#au-email") ? $("#au-email").value : "").trim();
  const pw = ($("#au-pw") ? $("#au-pw").value : "");
  AUTH.email = em; AUTH.err = ""; AUTH.note = "";
  if(!em){ AUTH.err = "이메일을 입력해 주세요"; render(); return; }
  if(AUTH.mode !== "reset" && pw.length < 6){
    AUTH.err = "비밀번호는 6자 이상이어야 합니다"; render(); return; }
  AUTH.busy = true; render();
  try{
    if(AUTH.mode === "reset"){
      await idt("sendOobCode", { requestType:"PASSWORD_RESET", email:em });
      /* 없는 주소여도 성공으로 옵니다. 그러니 "찾았다"고 말하면 안 됩니다 */
      AUTH.mode = "in";
      AUTH.note = "메일을 보냈습니다. 도착하지 않으면 스팸함도 확인해 주세요.";
      AUTH.busy = false; render(); return;
    }
    const j = AUTH.mode === "up"
      ? await idt("signUp", { email:em, password:pw, returnSecureToken:true })
      : await idt("signInWithPassword", { email:em, password:pw, returnSecureToken:true });
    authAdopt(j);
    setSolo(false);
    AUTH.busy = false;
    await afterLogin();
  }catch(e){
    AUTH.err = e.message; AUTH.busy = false; render();
  }
}

  if(D.s.ownerUid && D.s.ownerUid !== AUTH.uid){
    D.cards = []; D.log = {}; D.packs = []; D.del = {};

}

let syncT=null, syncing=false, syncDirty=false, syncState="";   // "" | "ing" | "ok" | "err"

/** 토큰으로 기존 Gist를 찾고, 없으면 새로 만듭니다 */
/* ── 동기화 ──────────────────────────────────────────────────────
   이 앱에서 데이터를 가장 많이 쓰는 부분입니다. 단어가 쌓이면 한 번에 수백 KB를
   주고받게 되므로 세 가지로 줄였습니다.
   1) 원격이 그대로면 ETag 로 304 를 받아 본문을 아예 내려받지 않습니다.
   2) 올릴 내용이 지난번과 같으면 올리지 않습니다.
   3) 저데이터 모드에서는 자동 간격을 늘리고 화면 복귀 시 자동 수신을 끕니다. */
function payloadJSON(){
  /* 시각 같은 매번 달라지는 값을 넣으면 "바뀐 게 없는데도" 매번 올리게 됩니다 */
  return JSON.stringify({v:2, cards:D.cards, log:D.log, packs:D.packs, del:D.del, packMeta:D.packMeta});
}
/** 내용이 같은지만 보면 되므로 짧은 지문이면 충분합니다 */
function sig(s){
  let h = 5381;
  for(let i=0;i<s.length;i++) h = ((h<<5) + h + s.charCodeAt(i)) | 0;
  return s.length + ":" + (h >>> 0).toString(36);
}

/** 원격 데이터를 지금 데이터에 합칩니다. {add, upd} 를 돌려줍니다
    카드 상태는 더 나중에 고친 쪽을 따릅니다(updatedAt).
    시각 정보가 없는 예전 데이터끼리는 진도(seen)가 앞선 쪽을 따릅니다.
    하루 기록은 기기 칸별로 큰 값을 써서, 폰과 PC 기록이 합산됩니다. */
function mergeData(p){
  if(!p||!Array.isArray(p.cards)) return {add:0,upd:0};
  const TOMB = 180*DAY;

  /* 지운 단어 목록을 양쪽에서 합칩니다 (늦게 지운 시각이 기준) */
  const theirDel = p.del||{};
  for(const w in theirDel)
    if((theirDel[w]||0) > (D.del[w]||0)) D.del[w] = theirDel[w];

  /* 다른 기기에서 지운 단어는 여기서도 없앱니다.
     단, 지운 뒤에 다시 만들어진 카드는 살려둡니다 */
  D.cards = D.cards.filter(c=>{
    const t = D.del[(c.word||"").toLowerCase()];
    return !(t && (c.createdAt||0) <= t);
  });

  const byWord = new Map(D.cards.map(c=>[(c.word||"").toLowerCase(), c]));
  const byIdx  = new Map(D.cards.map(c=>[c.id, c]));
  let add=0, upd=0;

  p.cards.forEach(inc=>{
    const w = (inc.word||"").toLowerCase();
    if(!w) return;
    const killed = D.del[w];
    if(killed && (inc.createdAt||0) <= killed) return;   // 여기서 지운 단어는 다시 받지 않습니다

    /* id 가 같아도 단어가 다르면 다른 카드입니다 */
    let cur = byIdx.get(inc.id);
    if(cur && (cur.word||"").toLowerCase() !== w) cur = null;
    if(!cur) cur = byWord.get(w);

    if(!cur){
      const made = Object.assign(newCard({}), inc);
      if(byIdx.has(made.id)) made.id = uid();
      if(!made.updatedAt) made.updatedAt = made.createdAt||0;
      D.cards.push(made); byWord.set(w, made); byIdx.set(made.id, made);
      add++; return;
    }

    const theirTime = inc.updatedAt||0, myTime = cur.updatedAt||0;
    const takeRemote = theirTime > myTime ? true
                     : theirTime < myTime ? false
                     : (inc.seen||0) > (cur.seen||0);
    let changed = false;

    if(takeRemote){
      CARD_STATE.forEach(f=>{ if(inc[f]!==undefined) cur[f]=inc[f]; });
      cur.updatedAt = Math.max(theirTime, myTime);
      changed = true;
    }
    /* 뜻·예문은 비어 있으면 채우고, 양쪽에 다 있으면 최신 쪽을 씁니다 */
    ["meaning","example","collocation","syn","ant","pack"].forEach(f=>{
      const mine = cur[f]||"", their = inc[f]||"";
      if(!mine && their){ cur[f]=their; changed=true; }
      else if(mine && their && mine!==their && theirTime>myTime){ cur[f]=their; changed=true; }
    });
    if(changed) upd++;
  });

  /* 하루 기록 — 기기 칸별로 큰 값. 칸이 다르면 둘 다 남아 합산됩니다 */
  Object.entries(p.log||{}).forEach(([d,raw])=>{
    const row = normRow(raw);
    if(!row || typeof row !== "object") return;
    const mine = D.log[d] || (D.log[d] = {});
    Object.entries(row).forEach(([dev,v])=>{
      if(!v || typeof v !== "object") return;
      const cur = mine[dev] || (mine[dev] = {r:0,c:0,n:0});
      cur.r = Math.max(cur.r||0, v.r||0);
      cur.c = Math.max(cur.c||0, v.c||0);
      cur.n = Math.max(cur.n||0, v.n||0);
    });
  });

  /* 팩 색·아이콘 — 더 나중에 고친 쪽을 따릅니다 */
  if(!D.packMeta) D.packMeta = {};
  Object.entries(p.packMeta||{}).forEach(([k,v])=>{
    if(!v || typeof v !== "object") return;
    const cur = D.packMeta[k];
    if(!cur || (v.at||0) > (cur.at||0)) D.packMeta[k] = v;
  });

  /* 오래된 삭제 기록은 정리합니다 */
  const cut = Date.now() - TOMB;
  for(const w in D.del) if(D.del[w] < cut) delete D.del[w];

  D.packs=[...new Set([...(D.packs||[]), ...(p.packs||[])])];
  syncPacks();
  return {add,upd};
}

function doRename(name){
  const nn=(name||"").trim().replace(/^\/+|\/+$/g,"");
  if(!nn||nn===packPath) return;
  if(allPacks().includes(nn)){ toast("같은 이름의 팩이 이미 있습니다"); return; }
  D.cards.forEach(c=>{ if(c.pack===packPath) c.pack=nn;
    else if(c.pack.startsWith(packPath+"/")) c.pack=nn+c.pack.slice(packPath.length); });
  D.packs=D.packs.map(p=>p===packPath?nn:(p.startsWith(packPath+"/")?nn+p.slice(packPath.length):p));
  if(D.s.lastPack===packPath) D.s.lastPack=nn;
  /* 색·아이콘도 새 이름으로 옮깁니다 */
  const meta={};
  Object.entries(D.packMeta||{}).forEach(([k,v])=>{
    meta[ k===packPath ? nn : (k.startsWith(packPath+"/") ? nn+k.slice(packPath.length) : k) ] = v; });
  D.packMeta=meta;
  packPath=nn; syncPacks(); save(); render(); toast("이름을 바꿨습니다");
}
function doPackDelete(){
  D.cards.forEach(c=>{ if(inPack(c,packPath)) c.pack=""; });
  D.packs=D.packs.filter(p=>p!==packPath && !p.startsWith(packPath+"/"));
  Object.keys(D.packMeta||{}).forEach(k=>{
    if(k===packPath || k.startsWith(packPath+"/")) delete D.packMeta[k]; });
  if(D.s.lastPack===packPath) D.s.lastPack="";
  packPath=packPath.split("/").slice(0,-1).join("/");
  syncPacks(); save(); render(); toast("팩을 없앴습니다");
}

function scheduleSync(){
  if(!FB.ready || !AUTH.uid || AUTH.approved === false) return;
  if(syncing){ syncDirty=true; return; }   // 동기화 중 생긴 변경은 끝난 뒤 다시 올립니다
  clearTimeout(syncT);
  syncT=setTimeout(()=>syncNow(true), D.s.lowData ? 60000 : 8000);
}

async function syncNow(silent){
  if(!FB.ready || !AUTH.uid || syncing || AUTH.approved === false) return;
  syncing=true; syncDirty=false; syncState="ing"; paintSync();
  let r = {add:0, upd:0}, pushed = false;
  try{
    await freshToken();
    /* 받아서 합치고 올립니다. 그 사이 다른 기기가 먼저 썼으면 412 가 오므로 다시 합칩니다 */
    for(let n=0; n<3; n++){
      const got = await dbGet();
      if(got.json){ const m = mergeData(got.json); r.add += m.add; r.upd += m.upd; }
      const body = payloadJSON();
      if(got.raw === body) break;            // 원격과 글자 하나까지 같습니다 — 올릴 것이 없습니다
      const put = await dbPut(body, got.etag);
      if(put.conflict) continue;
      pushed = true; break;
    }
    D.s.syncedAt = Date.now();
    try{ localStorage.setItem(KEY, JSON.stringify(D)); savePending=false; }catch(e){}
    syncState = "ok";
    if(!silent) toast(
      (r.add||r.upd) ? ("동기화 완료 · 새 단어 "+r.add+"개, 진도 "+r.upd+"개 갱신")
      : pushed ? "동기화 완료" : "이미 최신입니다");
    syncing=false; paintSync();
    if(!silent || r.add || r.upd) render();
    if(syncDirty) scheduleSync();
  }catch(e){
    syncState="err"; syncing=false; paintSync();
    if(syncDirty) scheduleSync();
    if(!silent) toast("동기화 실패: " + e.message);
    /* 토큰이 끊겼으면 로그인 화면으로 돌려보냅니다 */
    if(!AUTH.refreshToken) render();
  }
}

function paintSync(){
  const el=$("#syncdot"); if(!el) return;
  if(!FB.ready || !AUTH.uid){ el.textContent=""; return; }
  el.textContent = syncState==="ing" ? "⟳" : syncState==="err" ? "⚠" : "";
  el.style.color = syncState==="err" ? "var(--rose)" : "var(--muted)";
}
const syncAgo = () => {
  if(!D.s.syncedAt) return "아직 없음";
  const m=Math.round((Date.now()-D.s.syncedAt)/60000);
  return m<1?"방금":m<60?(m+"분 전"):(Math.round(m/60)+"시간 전");
};

/* ── 팩 레지스트리 ── */
/** 카드에 실제로 쓰인 팩까지 목록에 합쳐둡니다 (빈 팩도 유지) */
function syncPacks(){
  const set=new Set(D.packs||[]);
  D.cards.forEach(c=>{ if(c.pack) set.add(c.pack); });
  D.packs=[...set].filter(Boolean).sort((a,b)=>a.localeCompare(b,"ko"));
}
const allPacks = () => { syncPacks(); return D.packs; };
function addPack(name){
  name=(name||"").trim().replace(/^\/+|\/+$/g,"").replace(/\s*\/\s*/g,"/");
  if(!name) return "";
  if(!D.packs.includes(name)){ D.packs.push(name); D.packs.sort((a,b)=>a.localeCompare(b,"ko")); save(); }
  return name;
}

function newCard(f){ return Object.assign({
  id:uid(), word:"", meaning:"", example:"", collocation:"", syn:"", ant:"", tags:[], pack:"", auto:false,
  susp:false, leech:false,
  ef:2.5, reps:0, step:0, st:0, interval:0, lapses:0, lapseIvl:0, seen:0, correct:0, due:sod(),
  createdAt:Date.now(), updatedAt:Date.now()
}, f); }

/* ── 간격 계산 ─────────────────────────────────────────────────────
   Anki 26.09 기본 스케줄러(SM-2)의 상수와 공식을 그대로 옮겼습니다.
   Anki 는 FSRS 를 선택 기능으로 두고 있을 뿐, 기본값은 여전히 이 방식입니다.

   한 가지만 다릅니다 — Anki 의 학습 단계는 "1분 뒤 · 10분 뒤" 처럼 분 단위인데
   이 앱은 분 단위 타이머가 없어 "같은 세션에서 다시" 로 옮겼습니다.
   하루 이상 간격은 Anki 와 같은 값이 나옵니다. */
const ANKI = {
  learnSteps:2,                                   // Anki 기본 1m 10m → 2단계
  relearnSteps:1,                                 // Anki 기본 10m → 1단계
  gradGood:1, gradEasy:4,                         // 졸업 간격 · 쉬움 졸업 간격
  minEase:1.3,
  againDelta:-0.20, hardDelta:-0.15, easyDelta:0.15,
  hardMult:1.2, easyBonus:1.3, ivlMult:1.0,
  lapseMult:0.0, minLapseIvl:1,
  /* 설정에서 뺀 값들. Anki 기본은 최대 간격 36500일이지만,
     간격이 1년 반까지 벌어져 단어가 사라지는 문제가 있어 365일로 둡니다 */
  maxIvl:365, leechAt:8
};
const maxIvl = () => ANKI.maxIvl;

/** 지금 어느 단계인지 — 0 새 카드 · 1 학습 · 2 복습 · 3 재학습 */
function cardSt(c){
  if(c.st!==undefined) return c.st;
  if((c.seen||0)===0) return 0;
  if((c.step||0)>=1)  return (c.reps||0)>0 ? 3 : 1;
  return 2;
}

/** Anki 와 같은 편차 폭 — 1일 + 구간별 누진. 2.5일 미만은 편차를 넣지 않습니다 */
function fuzzDelta(i){
  if(i<2.5) return 0;
  return 1 + 0.15*Math.max(0, Math.min(i,7)-2.5)
           + 0.10*Math.max(0, Math.min(i,20)-7)
           + 0.05*Math.max(0, i-20);
}
/** 카드 id 와 복습 횟수로 고정되는 난수.
    Anki 와 같은 방식이라 버튼에 적힌 숫자가 실제 적용값과 항상 같습니다 */
function fuzzSeed(c){
  let h = 2166136261 ^ (c.reps||0);
  const s = String(c.id||"");
  for(let i=0;i<s.length;i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  h = (h ^ (h>>>15)) >>> 0;
  return h / 4294967296;
}
/** 편차를 적용하고 하한·상한으로 자릅니다 */
function fuzzIvl(raw, c, minI){
  const cap = maxIvl();
  const lim = Math.min(minI, cap);          // 상한보다 큰 하한은 상한에 맞춥니다
  const d = fuzzDelta(raw);
  if(d===0) return Math.min(cap, Math.max(lim, Math.round(raw)));
  const lo = Math.max(lim, Math.min(Math.round(raw-d), cap));
  let   hi = Math.max(lo,  Math.min(Math.round(raw+d), cap));
  if(lo===hi && hi>2 && hi<cap) hi = lo+1;
  const pick = Math.floor(lo + fuzzSeed(c)*(1+hi-lo));
  return Math.min(hi, Math.max(lo, pick));
}

/** 복습 카드의 세 버튼 간격.
    하한이 사슬로 묶여 있어 애매 < 알아 < 쉬움 순서가 항상 지켜집니다 */
function reviewIvls(c){
  const sched = Math.max(c.interval||0, 1);
  const late  = Math.max(0, Math.floor((Date.now()-(c.due||Date.now()))/DAY));
  const ef    = c.ef || 2.5;
  const hard = fuzzIvl(sched*ANKI.hardMult*ANKI.ivlMult, c, sched+1);
  const good = fuzzIvl((sched+late/2)*ef*ANKI.ivlMult, c, hard+1);
  const easy = fuzzIvl((sched+late)*ef*ANKI.easyBonus*ANKI.ivlMult, c, good+1);
  return {hard, good, easy};
}

/** 세션 안에서 다시 보여줄 때, 몇 장 뒤에 끼워넣을지 */
const reshowGap = q => q<3 ? 4 : q===3 ? 8 : 14;

function schedule(c,q){
  const s = {...c};
  s.seen = (c.seen||0)+1;
  s.reps = (c.reps||0)+1;
  if(q>=3) s.correct = (c.correct||0)+1;
  const st = cardSt(c), step = c.step||0;

  /* 같은 세션에서 다시 보여줍니다 (Anki 의 분 단위 단계에 해당) */
  const hold = (nextStep, state) => {
    s.st=state; s.step=nextStep; s.interval=0; s.due=Date.now(); return s;
  };
  /* 복습 단계로 졸업시킵니다 */
  const grad = ivl => {
    s.st=2; s.step=0; s.lapseIvl=0;
    s.interval = fuzzIvl(ivl, c, 1);
    s.due = sod()+s.interval*DAY; return s;
  };

  /* 새 카드 · 학습 중 */
  if(st===0 || st===1){
    if(q===0) return hold(0,1);                                   // 모름 — 첫 단계로
    if(q===5) return grad(ANKI.gradEasy);                         // 쉬움 — 바로 졸업
    if(q===4) return step+1>=ANKI.learnSteps ? grad(ANKI.gradGood) : hold(step+1,1);
    return hold(step,1);                                          // 애매 — 같은 단계 유지
  }

  /* 재학습 중 (복습하다 틀린 카드) */
  if(st===3){
    const back = Math.max(1, c.lapseIvl||ANKI.minLapseIvl);
    if(q===0) return hold(0,3);
    if(q===5) return grad(back+1);
    if(q===4) return step+1>=ANKI.relearnSteps ? grad(back) : hold(step+1,3);
    return hold(step,3);
  }

  /* 복습 카드 */
  if(q===0){
    s.ef = Math.max(ANKI.minEase, (c.ef||2.5)+ANKI.againDelta);
    s.lapses = (c.lapses||0)+1;
    s.lapseIvl = fuzzIvl(Math.max(c.interval||0,1)*ANKI.lapseMult, c, ANKI.minLapseIvl);
    if(ANKI.relearnSteps>0){ s.st=3; s.step=0; s.interval=0; s.due=Date.now(); return s; }
    s.st=2; s.step=0; s.interval=s.lapseIvl; s.due=sod()+s.interval*DAY; return s;
  }
  const iv = reviewIvls(c);
  s.ef = q===3 ? Math.max(ANKI.minEase,(c.ef||2.5)+ANKI.hardDelta)
       : q===5 ? (c.ef||2.5)+ANKI.easyDelta
       : (c.ef||2.5);
  s.st=2; s.step=0; s.lapseIvl=0;
  s.interval = q===3 ? iv.hard : q===4 ? iv.good : iv.easy;
  s.due = sod()+s.interval*DAY;
  return s;
}

/** 버튼을 눌렀을 때 실제로 적용될 간격(일). 0 이면 같은 세션에서 다시 나옵니다.
    편차가 카드별로 고정되어 있으므로 이 값은 실제 적용값과 정확히 같습니다 */
const prevInt = (c,q) => {
  const st = cardSt(c), step = c.step||0;
  if(st===0 || st===1){
    if(q===5) return fuzzIvl(ANKI.gradEasy, c, 1);
    if(q===4 && step+1>=ANKI.learnSteps) return fuzzIvl(ANKI.gradGood, c, 1);
    return 0;
  }
  if(st===3){
    const back = Math.max(1, c.lapseIvl||ANKI.minLapseIvl);
    if(q===5) return fuzzIvl(back+1, c, 1);
    if(q===4 && step+1>=ANKI.relearnSteps) return fuzzIvl(back, c, 1);
    return 0;
  }
  if(q===0) return ANKI.relearnSteps>0 ? 0
    : fuzzIvl(Math.max(c.interval||0,1)*ANKI.lapseMult, c, ANKI.minLapseIvl);
  const iv = reviewIvls(c);
  return q===3 ? iv.hard : q===4 ? iv.good : iv.easy;
};

/** 채점 버튼에 표시할 문구 */
function prevLabel(c,q){
  const d = prevInt(c,q);
  if(d>0) return d+"일 뒤";
  /* 분 단위 타이머가 없으니 몇 장 뒤에 다시 나오는지를 보여줍니다.
     그렇게 해야 버튼 넷이 서로 다른 정보를 가집니다 */
  const left = S ? Math.max(1, S.queue.length-S.idx-1) : reshowGap(q);
  return Math.min(reshowGap(q), left)+"장 뒤";
}

const streak = () => { let n=0; for(let i=0;i<400;i++){ const k=dayKey(new Date(Date.now()-i*DAY));
  if(dayStat(k).reviews>0) n++; else if(i>0) break; } return n; };

/* ══════════════════ 큐 ══════════════════ */
const active = () => D.cards.filter(c=>!c.susp);
const inPack = (c,p) => !p ? true : (p==="__none" ? !c.pack : (c.pack===p || c.pack.startsWith(p+"/")));
const todayDone = () => dayStat(dayKey()).reviews;

/** 밀린 것 전부 (오래 밀린 순) */
function dueAll(p){ const now=Date.now();
  return active().filter(c=>c.seen>0 && c.due<=now && inPack(c,p)).sort((a,b)=>a.due-b.due); }
/** 오늘 상한 안에서 꺼낼 수 있는 것 */
function dueToday(p){ const room=D.s.maxReview>0?Math.max(0,D.s.maxReview-todayDone()):Infinity;
  return dueAll(p).slice(0, room===Infinity?undefined:room); }
function freshList(p){ const used=dayStat(dayKey()).newSeen;
  return active().filter(c=>c.seen===0 && inPack(c,p)).slice(0, Math.max(0, D.s.dailyNew-used)); }
function weakList(p){ return active().filter(c=>inPack(c,p) && (c.lapses>0||(c.seen>=2&&c.correct/c.seen<0.7)))
  .sort((a,b)=>b.lapses-a.lapses||(a.correct/(a.seen||1))-(b.correct/(b.seen||1))).slice(0,40); }
/** 팩 전체 훑기 (일정 무시) */
function sweepList(p){ return active().filter(c=>inPack(c,p))
  .sort((a,b)=>b.lapses-a.lapses||(a.correct/(a.seen||1))-(b.correct/(b.seen||1))); }

function buildQueue(o){
  o=o||{};
  let ids;
  if(o.kind==="focus") ids=weakList(o.pack).map(c=>c.id);
  else if(o.kind==="sweep") ids=sweepList(o.pack).map(c=>c.id);
  else{
    const due=dueToday(o.pack), fr=freshList(o.pack);
    ids=[]; let i=0;
    due.forEach((c,k)=>{ ids.push(c.id); if(k%3===2&&i<fr.length) ids.push(fr[i++].id); });
    while(i<fr.length) ids.push(fr[i++].id);
  }
  /* Anki 는 세션을 몇 장으로 끊는 개념이 없습니다.
     오늘 몴을 한 번에 내주고, 중간에 그만두면 거기까지가 오늘 한 것입니다 */
  return ids;
}

/* ══════════════════ 음성 ══════════════════ */
/* ── 음성 ───────────────────────────────────────────────────────
   lang 만 "en-US" 로 지정하고 음성을 고르지 않으면, 한국어 환경의 기기는
   시스템 기본(한국어) 음성으로 영어를 읽어버립니다. 그래서 발음이 이상하게 들립니다.
   반드시 영어 음성을 직접 골라서 넣습니다. */
const TTS = { ok: "speechSynthesis" in window, voices: [] };
const isEnVoice = v => /^en[-_]?/i.test(v.lang || "");

function loadVoices(){
  if(!TTS.ok) return;
  let list = [];
  try{ list = speechSynthesis.getVoices() || []; }catch(e){}
  TTS.voices = list.filter(isEnVoice);
}
/** 쓸 만한 영어 음성을 고릅니다. 사용자가 고른 것이 있으면 그것을 씁니다 */
function bestVoice(){
  if(!TTS.ok) return null;
  let list = [];
  try{ list = (speechSynthesis.getVoices() || []).filter(isEnVoice); }catch(e){}
  if(!list.length) return null;
  const saved = list.find(v => v.voiceURI === D.s.voiceURI);
  if(saved) return saved;
  /* 고르지 않았으면 품질이 나은 쪽을 자동으로 집습니다 */
  const score = v => {
    let n = 0;
    if(/^en[-_]?US/i.test(v.lang)) n += 4;
    else if(/^en[-_]?GB/i.test(v.lang)) n += 3;
    else n += 1;
    if(/google|natural|neural|premium|enhanced|siri|samantha/i.test(v.name || "")) n += 3;
    if(v.localService === false) n += 1;
    if(v.default) n += 1;
    return n;
  };
  return list.slice().sort((a,b) => score(b) - score(a))[0];
}
if(TTS.ok){
  loadVoices();
  speechSynthesis.onvoiceschanged = () => {
    loadVoices();
    /* 음성 목록은 늦게 도착합니다. 설정 화면이 열려 있으면 선택지를 다시 그립니다 */
    if(view === "settings" && !S) render();
  };
}

let speakT = null;
function speak(text){
  if(!TTS.ok || !text) return;
  const say = String(text);
  try{
    speechSynthesis.cancel();
    clearTimeout(speakT);
    /* cancel 직후 곧바로 speak 하면 일부 브라우저에서 첫 음절이 잘립니다 */
    speakT = setTimeout(() => {
      try{
        const u = new SpeechSynthesisUtterance(say);
        u.rate = D.s.rate;
        const v = bestVoice();
        if(v){ u.voice = v; u.lang = v.lang || "en-US"; }
        else u.lang = "en-US";   // 영어 음성이 하나도 없으면 이것밖에 할 수 없습니다
        speechSynthesis.speak(u);
      }catch(e){}
    }, 90);
  }catch(e){}
}

/* ══════════════════ 세션 ══════════════════ */
let S = null; // {queue, idx, flipped, mode, focus, result, right}

function pickMode(c){
  const dir = D.s.front==="mix" ? (Math.random()<0.5?"en":"ko") : D.s.front;
  if(!D.s.typing) return dir==="en"?"en2ko":"ko2en_flip";
  const pool=[dir==="en"?"en2ko":"ko2en_flip"];
  const t=D.s.typeModes;
  if(t.ko2en) pool.push("type_ko2en");
  if(t.spell && c.example && hasWord(c.example,c.word)) pool.push("type_spell");
  if(t.dictation && TTS.ok) pool.push("type_dict");
  return pool[Math.floor(Math.random()*pool.length)];
}
const hasWord=(ex,w)=>new RegExp("\\b"+escRe(w)+"\\w*\\b","i").test(ex);
function blankOut(ex,w){ const re=new RegExp("\\b("+escRe(w)+"\\w*)\\b","i"); const m=ex.match(re);
  return { text: ex.replace(re,"______"), surface: m?m[1]:w }; }
function highlight(ex,w){
  return esc(ex).replace(new RegExp("\\b("+escRe(esc(w))+"\\w*)\\b","i"), "<em>$1</em>"); }
const byId = id => D.cards.find(c=>c.id===id);

function startSession(o){
  o=o||{kind:"review"};
  const q=buildQueue(o);
  if(!q.length){ toast("학습할 카드가 없습니다"); return; }
  S={queue:q, idx:0, flipped:false, animate:false, undo:[], kind:o.kind, pack:o.pack||"",
     noSched:o.kind!=="review", result:null, right:0, input:""};
  S.mode=pickMode(byId(q[0]));
  view="study"; render(); afterCard();
}
function afterCard(){
  const c=byId(S.queue[S.idx]); if(!c) return;
  if(S.mode==="type_dict" && D.s.autoSpeak && !S.flipped) speak(c.word);
  const inp=$("#typein"); if(inp) setTimeout(()=>inp.focus(),80);
}
function flip(){ if(S.flipped) return; S.flipped=true; S.animate=true; render();
  const c=byId(S.queue[S.idx]); if(c && D.s.autoSpeak) speak(c.word); }

function grade(q){
  const c=byId(S.queue[S.idx]); if(!c) return;
  const k=dayKey(), prevDev={...((D.log[k]||{})[DEV]||{r:0,c:0,n:0})};
  const wasNew=c.seen===0;
  /* 실행 취소용 스냅샷 */
  S.undo.push({ card:{...c}, day:k, log:prevDev, idx:S.idx, queue:[...S.queue],
                mode:S.mode, result:S.result, input:S.input, right:S.right });
  if(S.undo.length>15) S.undo.shift();

  if(S.noSched){
    Object.assign(c,{seen:c.seen+1, correct:c.correct+(q>=3?1:0)}); touch(c);
  }else{
    Object.assign(c, schedule(c,q)); touch(c);
    if(c.interval===0){   // 아직 졸업 전이면 이번 세션에서 다시 보여줍니다
      S.queue.splice(Math.min(S.idx+reshowGap(q), S.queue.length), 0, c.id);
    }
    /* Anki 와 같게 임계값 도달 후 절반 간격마다 다시 알립니다 (8 -> 12 -> 16) */
    if(q<3 && c.lapses>=ANKI.leechAt
       && (c.lapses-ANKI.leechAt) % Math.ceil(ANKI.leechAt/2) === 0){
      c.leech=true; toast('"'+c.word+'" 은 '+c.lapses+'번 틀렸습니다 — 카드를 고치거나 보류하세요');
    }
  }
  bumpDay(k, 1, q>=3?1:0, wasNew?1:0);
  save();
  starBurst(STARS_FOR(q));
  S.combo = q>=3 ? (S.combo||0)+1 : 0;
  if(S.combo>(S.best||0)) S.best=S.combo;
  if(q>=3) S.right++;
  S.idx++;
  if(S.idx>=S.queue.length){ const done={total:S.queue.length,right:S.right,best:S.best||0}; S=null; render(done); return; }
  S.flipped=false; S.result=null; S.input=""; S.animate=false;
  S.mode=pickMode(byId(S.queue[S.idx]));
  render(); afterCard();
}

/** 마지막 채점 되돌리기 */
function undoGrade(){
  if(!S||!S.undo.length){ toast("되돌릴 채점이 없습니다"); return; }
  const u=S.undo.pop();
  const c=byId(u.card.id);
  if(c) Object.assign(c, u.card);
  (D.log[u.day] || (D.log[u.day]={}))[DEV] = u.log;
  S.queue=u.queue; S.idx=u.idx; S.mode=u.mode; S.result=u.result;
  S.input=u.input; S.right=u.right; S.flipped=true; S.animate=false;
  save(); render(); toast("되돌렸습니다");
}

/** 오늘은 넘기기 — 벌점 없이 내일로 미룹니다 */
function buryCard(){
  if(!S) return;
  const c=byId(S.queue[S.idx]); if(!c) return;
  S.undo.push({ card:{...c}, day:dayKey(), log:{...((D.log[dayKey()]||{})[DEV]||{r:0,c:0,n:0})},
                idx:S.idx, queue:[...S.queue], mode:S.mode, result:S.result, input:S.input, right:S.right });
  if(S.undo.length>15) S.undo.shift();
  if(!S.noSched){ c.due=sod()+DAY; touch(c); save(); }
  S.queue=S.queue.filter((id,i)=>!(id===c.id&&i>=S.idx));
  if(S.idx>=S.queue.length){ const done={total:S.idx,right:S.right}; S=null; render(done); toast("내일 다시 나옵니다"); return; }
  S.flipped=false; S.result=null; S.input=""; S.animate=false;
  S.mode=pickMode(byId(S.queue[S.idx]));
  render(); afterCard(); toast("내일 다시 나옵니다");
}
function checkTyped(){
  const c=byId(S.queue[S.idx]); const val=$("#typein")?$("#typein").value:"";
  S.input=val;
  const exp=[c.word];
  if(S.mode==="type_spell"&&c.example&&hasWord(c.example,c.word)) exp.push(blankOut(c.example,c.word).surface);
  const g=norm(val);
  const exact=exp.some(e=>norm(e)===g);
  const typo=!exact&&exp.some(e=>norm(e).length>=4&&lev(norm(e),g)===1);
  S.result=exact?"ok":typo?"typo":"no";
  S.flipped=true; S.animate=true; render(); if(D.s.autoSpeak) speak(c.word);
}

/* ══════════════════ 렌더 ══════════════════ */
function render(done){
  /* 로그인이 켜져 있고 아직 안 들어왔으면 로그인 화면만 보여줍니다 */
  const gate = FB.ready && !AUTH.uid && !isSolo();
  const wait = FB.ready && AUTH.uid && AUTH.approved === false && !isSolo();
  $("#nav").style.display = (gate || wait) ? "none" : "";
  if(gate){ $("#main").innerHTML = viewLogin(); $("#streak").textContent=""; paintSync(); return; }
  if(wait){ $("#main").innerHTML = viewPending(); $("#streak").textContent=""; paintSync(); return; }
  $("#streak").textContent = streak()>0 ? streak()+"일 연속" : "";
  const n=dueToday().length+freshList().length, b=$("#duebadge");
  if(S){ b.textContent="●"; b.classList.remove("hide"); }
  else if(n>0){ b.textContent=n; b.classList.remove("hide"); }
  else b.classList.add("hide");
  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on", x.dataset.v===view));
  const m=$("#main");
  if(view==="study") m.innerHTML = S ? viewCard() : viewStudyHome(done);
  else if(view==="dict") m.innerHTML = viewDict();
  else if(view==="packs") m.innerHTML = viewPacks();
  else if(view==="manage") m.innerHTML = viewManage();
  else if(view==="stats") m.innerHTML = viewStats();
  else m.innerHTML = viewSettings();
  /* 새로 그린 요소에는 CSS 전환이 걸리지 않으므로, 다음 프레임에 클래스를 붙여 뒤집기를 재생합니다 */
  if(S && S.animate){
    S.animate=false;
    /* 탭이 백그라운드면 requestAnimationFrame 이 오지 않아 카드가 앞면에서 멈춥니다.
       짧은 타이머를 같이 걸어 둘 중 하나만 올려도 뒤집히게 합니다.
       요소는 적용 지점에서 다시 찾습니다 — 사이에 다시 그려졌을 수 있어서입니다 */
    let flipDone=false;
    const playFlip=()=>{
      if(flipDone) return; flipDone=true;
      const el=$("#flipwrap"); if(el) el.classList.add("flipped");
    };
    if($("#flipwrap")){
      requestAnimationFrame(()=>requestAnimationFrame(playFlip));
      setTimeout(playFlip, 120);
    }
  }
  paintSync();
}

    +'</div>'
    +'<div style="margin-top:15px;display:grid;gap:8px">'
    +'<button class="btn wide" data-a="start" '+(q?"":"disabled")+'>'
    +(q?("시작 · "+q+"장"+((today+fl)>q?(" (오늘 남은 "+(today+fl)+"장 중)"):"")):"오늘 복습할 카드 없음")+'</button>'
    +'<button class="btn ghost wide" data-a="start-focus" '+(wl?"":"disabled")+'>오답 집중 · '+wl+'장</button>'
    +'</div>';
  if(backlog>today) h+='<div class="warn">밀린 카드가 '+backlog+'장입니다. 하루 최대 '+D.s.maxReview
    +'장까지만 꺼내므로 나머지는 다음 날로 넘어갑니다. 계속 쌓이면 설정에서 <b>하루 신규 단어</b>를 줄이세요.</div>';
  else if(!q) h+='<p class="note">오늘 예정된 카드를 다 봤습니다. 팩 탭에서 특정 범위만 훑어볼 수 있습니다.</p>';
  h+='</div>';
  h+='<p class="note">오답 집중과 팩 훑기는 복습 일정을 바꾸지 않고 통계에만 반영됩니다.</p>';
  return h;
}
const stat=(v,l,c)=>'<div class="stat"><b'+(c?' style="color:'+c+'"':'')+'>'+v+'</b><span>'+l+'</span></div>';

/* ── 카드 ── */
function viewCard(){
  const c=byId(S.queue[S.idx]); if(!c) return "";
  const label={en2ko:"영 → 한", ko2en_flip:"한 → 영", type_ko2en:"타이핑", type_spell:"예문 빈칸", type_dict:"받아쓰기"}[S.mode];
  const typing=S.mode.startsWith("type_");
  let front="";
  if(S.mode==="en2ko") front='<div class="word">'+esc(c.word)+'</div>'
      +'<div class="hint">탭해서 뜻 보기</div>'
      + (TTS.ok?'<button class="speak corner" data-a="say" data-t="w">♪</button>':'');
  else if(S.mode==="ko2en_flip") front='<div class="wordko">'+esc(c.meaning)+'</div>'
      +'<div class="sub mono">'+c.word.length+'글자 · '+esc(c.word[0])+'…</div><div class="hint">탭해서 단어 보기</div>';
  else if(S.mode==="type_ko2en") front='<div class="wordko">'+esc(c.meaning)+'</div>'+typeBox();
  else if(S.mode==="type_spell" && c.example && hasWord(c.example,c.word)){ const b=blankOut(c.example,c.word);
    front='<div class="wordko" style="font-size:18px">'+esc(c.meaning)+'</div>'
      +'<div class="sub ex">'+esc(b.text)+'</div>'+typeBox(); }
  else if(S.mode==="type_dict") front='<div class="wordko" style="font-size:17px;color:#9DB2BF">들리는 단어를 입력하세요</div>'
      +'<button class="speak" style="width:56px;height:56px;font-size:21px" data-a="say" data-t="w">♪</button>'+typeBox();
  else front='<div class="wordko">'+esc(c.meaning)+'</div>'+typeBox();   // 예문이 없어진 경우 대체

  let back='<div class="word">'+esc(c.word)+'</div>'
    +'<div class="wordko" style="font-size:19px;margin-top:11px;color:#CFE0EB">'+esc(c.meaning)+'</div>';
  if(S.result) back+='<div class="verdict v-'+S.result+'">'
    +(S.result==="ok"?"정답":S.result==="typo"?('오타 · 입력 "'+esc(S.input)+'"'):(S.input?('오답 · 입력 "'+esc(S.input)+'"'):"오답"))+'</div>';
  if(c.example) back+='<div class="sub ex">'+highlight(c.example,c.word)+'</div>';
  if(c.collocation) back+='<div class="sub mono" style="font-size:12px;margin-top:8px">'+esc(c.collocation)+'</div>';
  const saPart=(v,k,label)=>{
    const xs=String(v||"").split(/[;,/]/).map(x=>x.trim()).filter(Boolean);
    return xs.length ? '<div class="sa"><b>'+label+'</b>'
      + xs.slice(0,5).map(x=>'<span class="'+k+'">'+esc(x)+'</span>').join("") + '</div>' : "";
  };
  back += saPart(c.syn,"syn","비슷한 말") + saPart(c.ant,"ant","반대말");
  if(TTS.ok) back+='<button class="speak corner" data-a="say" data-t="e">♪</button>';

  let bottom="";
  if(S.flipped){
    if(S.noSched) bottom='<div class="grades" style="grid-template-columns:1fr 1fr;margin-top:12px">'
      +'<button class="grade g0" data-a="grade" data-q="0"><b>몰랐음</b></button>'
      +'<button class="grade g5" data-a="grade" data-q="4"><b>알았음</b></button></div>';
    else {
      /* 뒤집기든 타이핑이든 같은 채점 척도를 씁니다 */
      const ch = gradeChoices();
      bottom = rail(c)
        + '<div class="grades" style="grid-template-columns:repeat('+ch.length+',1fr)">'
        + ch.map(q=>gbtn(q, GQ[q], q===0?"g0":q===5?"g5":"", c)).join("")
        + '</div>';
    }
  } else if(typing){
    bottom='<div class="row" style="margin-top:10px"><button class="btn" style="flex:1" data-a="check">확인</button>'
      +'<button class="btn ghost" data-a="giveup">모르겠음</button></div>';
  }

  const kindLabel = S.kind==="focus"?"오답 집중" : S.kind==="sweep"?("훑기 · "+(S.pack||"전체")) : "복습";
  const leftToday = S.kind==="review" ? (dueToday().length+freshList().length) : 0;
  return '<div class="stagehead"><span>'+esc(kindLabel)+' · '+label
    +((S.combo||0)>=3?'<span class="combo" style="margin-left:8px">★ 연속 '+S.combo+'</span>':'')+'</span>'
    +'<span class="mono">'+(S.idx+1)+' / '+S.queue.length
    +(leftToday>S.queue.length?(' · 오늘 '+leftToday):'')+'</span></div>'
    +'<div class="flipwrap'+(S.flipped&&!S.animate?" flipped":"")+'" id="flipwrap">'
    +'<div class="face front" data-a="'+(typing?"":"flip")+'">'+front+'</div>'
    +'<div class="face back" data-a="'+(S.flipped?"":"noop")+'">'+back+'</div></div>'
    + bottom
    +'<div class="prog"><i style="width:'+(S.idx/S.queue.length*100)+'%"></i></div>'
    +'<div class="row" style="justify-content:center;margin-top:10px">'
    +(S.undo.length?'<button class="btn sm ghost" data-a="undo">↶ 실행 취소</button>':'')
    +(S.flipped
      ? '<button class="btn sm ghost" data-a="edit-now" data-id="'+c.id+'">카드 수정</button>'
      : '<button class="btn sm ghost" data-a="bury">오늘 넘기기</button>')
    +'<button class="btn sm ghost" data-a="quit">종료</button></div>'
    +(S.flipped&&!S.noSched&&!S.result&&S.idx<2
      ?'<p class="note" style="text-align:center">좌우로 밀어도 채점됩니다</p>':'');
}
const typeBox=()=>'<input class="typein" id="typein" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 입력 후 Enter">';
const gbtn=(q,l,cls,c)=>'<button class="grade '+cls+'" data-a="grade" data-q="'+q+'"><b>'+l+'</b><i>'+prevLabel(c,q)+'</i></button>';
const GQ = {0:"모름", 3:"애매", 4:"알아", 5:"쉬움"};
/** 지금 화면에서 고를 수 있는 채점 등급.
    타이핑 답안도 뒤집기 카드와 같은 척도를 쓰도록 맞췄습니다.
    예전에는 타이핑이 "모름/알아" 둘만 써서, 같은 카드가 어떤 모드로
    나왔는지에 따라 복습 일정이 달라졌습니다. */
function gradeChoices(){
  if(!S) return [];
  if(S.noSched) return [0,4];
  if(S.result==="no")   return [0];      // 오답 — 고를 것이 없습니다
  if(S.result==="typo") return [0,3];    // 오타 — 틀린 것으로 볼지 사용자가 정합니다
  if(S.result==="ok")   return [3,4,5];  // 정답 — 체감 난이도만 고릅니다
  return [0,3,4,5];
}
function rail(c){
  const pos=d=>Math.min(100,Math.max(0,Math.log(Math.max(d,1))/Math.log(365)*100));
  let h='<div class="rail"><div class="railline"></div>';
  [1,3,7,21,60,180].forEach(t=>{ h+='<div class="tick" style="left:'+pos(t)+'%"></div><div class="ticklab" style="left:'+pos(t)+'%">'+t+'d</div>'; });
  [3,4,5].forEach(q=>{ h+='<div class="dot gh" style="left:'+pos(prevInt(c,q))+'%"></div>'; });
  return h+'<div class="dot now" style="left:'+pos(c.interval||1)+'%"></div></div>';
}

/* ── 팩마다 색과 아이콘 ──
   하위 팩은 비워 두면 위에서 물려받습니다. 영 쉘던 을 파랑으로 두면
   영 쉘던/S1, 영 쉘던/S1/E02 도 파랑으로 보입니다. */
const PACK_COLORS = ["#2A4C7D","#16785A","#A6394A","#B5820E",
                     "#6B4FA0","#1F7A8C","#C2622C","#55606B"];
const PACK_ICONS  = ["📺","🎬","📚","📝","🧪","💼","✈️","🍳","⚖️","🩺","🎧","💬","🧠","🔖"];

function packStyle(path){
  const out = {c:null, e:""};
  if(!path || path==="__none") return out;
  let p = path;
  while(p){
    const m = (D.packMeta||{})[p];
    if(m){
      if(out.c===null && m.c!==undefined && m.c!==null) out.c = m.c;
      if(!out.e && m.e) out.e = m.e;
    }
    if(out.c!==null && out.e) break;
    const i = p.lastIndexOf("/");
    p = i < 0 ? "" : p.slice(0, i);
  }
  return out;
}
const packColor = path => { const c = packStyle(path).c;
  return (c===null || c===undefined) ? null : PACK_COLORS[c % PACK_COLORS.length]; };
const packIcon = path => packStyle(path).e;
/** 드롭다운이나 목록 앞에 붙일 아이콘 (없으면 빈 문자열) */
const packTag = path => { const e = packIcon(path); return e ? e + " " : ""; };

function setPackMeta(path, patch){
  if(!path || path==="__none") return;
  if(!D.packMeta) D.packMeta = {};
  const m = (D.packMeta[path] = D.packMeta[path] || {});
  Object.assign(m, patch, {at: Date.now()});
  save(); render();
}

/** 팩 화면의 색·아이콘 고르기 */
function packStyleBox(){
  const own = (D.packMeta||{})[packPath] || {};
  const eff = packStyle(packPath);
  const inherited = (own.c===undefined||own.c===null) && eff.c!==null;
  let h = '<div class="h2" style="margin-bottom:9px">색</div><div class="swatches">';
  h += '<button class="swatch none'+((own.c===undefined||own.c===null)?" on":"")+'" '
     + 'data-a="pack-color" data-i="" aria-label="색 없음">—</button>';
  PACK_COLORS.forEach((col,i)=>{
    h += '<button class="swatch'+(own.c===i?" on":"")+'" style="background:'+col+'" '
       + 'data-a="pack-color" data-i="'+i+'" aria-label="색 '+(i+1)+'"></button>';
  });
  h += '</div>';
  h += '<div class="h2" style="margin:14px 0 9px">아이콘</div><div class="swatches">';
  h += '<button class="iconbtn'+(!own.e?" on":"")+'" data-a="pack-icon" data-e="">—</button>';
  PACK_ICONS.forEach(e=>{
    h += '<button class="iconbtn'+(own.e===e?" on":"")+'" data-a="pack-icon" data-e="'+esc(e)+'">'+e+'</button>';
  });
  h += '</div>';
  h += '<p class="note">비워 두면 위 팩의 것을 물려받습니다.'
     + (inherited ? ' 지금은 <b>위에서 물려받은 색</b>으로 보이고 있습니다.' : '')
     + '</p>';
  return h;
}

/* ── 팩 브라우저 ── */
let packPath = "";   // "" = 최상위, "__none" = 분류 없음, 그 외 = 경로
function packStats(p){
  const cs=D.cards.filter(c=>inPack(c,p));
  const seen=cs.reduce((s,c)=>s+c.seen,0), cor=cs.reduce((s,c)=>s+c.correct,0);
  return { n:cs.length, due:dueAll(p).length, fresh:cs.filter(c=>c.seen===0&&!c.susp).length,
    acc:seen?Math.round(cor/seen*100):null, leech:cs.filter(c=>c.leech&&!c.susp).length };
}
function childSegments(prefix){
  const set=new Map();
  const sources=[...D.cards.map(c=>c.pack), ...allPacks()];
  sources.forEach(pk=>{
    if(!pk) return;
    if(prefix && !(pk===prefix||pk.startsWith(prefix+"/"))) return;
    const rest=prefix ? pk.slice(prefix.length+1) : pk;
    if(!rest) return;
    const seg=rest.split("/")[0];
    set.set(prefix?prefix+"/"+seg:seg, true);
  });
  return [...set.keys()].sort((a,b)=>a.localeCompare(b,"ko"));
}
function viewPacks(){
  const kids=childSegments(packPath);
  const exact=D.cards.filter(c=>packPath==="__none" ? !c.pack : c.pack===packPath);
  const noneCount=D.cards.filter(c=>!c.pack).length;
  let h="";

  /* 경로 표시 */
  if(packPath){
    const segs=packPath==="__none"?["분류 없음"]:packPath.split("/");
    h+='<div class="panel" style="padding:13px 15px">'
      +'<div class="row" style="font-size:13px">'
      +'<button class="btn sm ghost" data-a="pack-up">← 뒤로</button>'
      +'<span class="mono muted" style="font-size:12px">'
      + packTag(packPath) + esc(segs.join(" / "))+'</span></div>';
    const st=packStats(packPath);
    h+='<div class="grid4" style="margin-top:12px">'
      + stat(st.n,"단어") + stat(st.due,"복습 대기")
      + stat(st.acc===null?"—":st.acc+"%","정답률", st.acc!==null&&st.acc<70?"var(--rose)":"var(--green)")
      + stat(st.leech,"누수", st.leech?"var(--rose)":"")+'</div>'
      +'<div style="margin-top:12px;display:grid;gap:7px">'
      +'<button class="btn wide" data-a="pack-review" '+(st.due?"":"disabled")+'>이 팩 복습 · '+st.due+'장</button>'
      +'<button class="btn ghost wide" data-a="pack-sweep" '+(st.n?"":"disabled")+'>전체 훑기 · '+st.n+'장</button>'
      +'<p class="note" style="margin:2px 0 0">복습은 오늘 차례가 된 것만 나오고 일정이 바뀝니다. '
      +'훑기는 차례와 상관없이 전부 보여주고 일정을 바꾸지 않습니다.</p>'
      +'</div>';
    h+='<div class="row" style="margin-top:10px">'
      +'<button class="btn sm ghost" data-a="pack-csv">CSV로 내보내기</button>'
      +'<button class="btn sm ghost" data-a="pack-csv-in">CSV로 넣기</button>'
      +'</div>'
      +'<p class="note" style="margin:6px 0 0">넣으면 이 팩으로 들어갑니다. 파일에 팩 칸이 적혀 있으면 그쪽을 따릅니다.</p>';
    if(packPath!=="__none")
      h+=setBox("색과 아이콘",
        (packIcon(packPath)||"") + (packColor(packPath)?" 색 있음":" 아직 없음"),
        packStyleBox());
    if(packPath!=="__none") h+='<div class="row" style="margin-top:8px">'
      +'<button class="btn sm ghost" data-a="pack-sub">＋ 하위 팩</button>'
      +'<button class="btn sm ghost" data-a="pack-rename">이름 바꾸기</button>'
      +'<button class="btn sm ghost" style="color:var(--rose)" data-a="pack-del">팩 삭제</button></div>';
    h+='</div>';
  }else{
    h+='<div class="panel" style="padding:13px 15px">'
      +'<div class="row" style="justify-content:space-between"><div class="h2" style="margin:0">팩</div>'
      +'<button class="btn sm" data-a="pack-new">＋ 새 팩</button></div>'
      +'<p class="note">팩을 먼저 만들어 두면 단어를 넣을 때 목록에서 고르기만 하면 됩니다. '
      +'이름을 <span class="mono">영 쉘던/S1/E02</span> 처럼 <span class="mono">/</span> 로 나누면 폴더처럼 정리됩니다.</p></div>';
  }

  /* 하위 팩 */
  if(kids.length){
    h+='<div class="panel"><div class="h2">'+(packPath?"하위 팩":"팩 목록")+'</div>';
    kids.forEach(k=>{ const st=packStats(k);
      const col=packColor(k);
      h+='<div class="item" data-a="pack-open" data-p="'+esc(k)+'" style="cursor:pointer">'
        +'<div class="row" style="justify-content:space-between;flex-wrap:nowrap">'
        +(col?'<div class="packbar" style="background:'+col+'"></div>':'')
        +'<div style="min-width:0;flex:1"><div style="font-size:15px;font-weight:600">'
        +packTag(k)+esc(k.split("/").pop())+(st.leech?' <span class="chip rev">누수 '+st.leech+'</span>':'')+'</div>'
        +'<div class="meta">'+st.n+'단어'+(st.acc!==null?" · 정답률 "+st.acc+"%":"")+'</div></div>'
        +'<div class="row" style="flex-wrap:nowrap;align-items:center">'
        +(st.due?'<span class="chip" style="background:rgba(166,57,74,.12);color:var(--rose)">'+st.due+'</span>':'')
        +'<span class="muted" style="font-size:18px">›</span></div></div></div>';
    });
    h+='</div>';
  }
  if(!packPath && noneCount){
    h+='<div class="panel"><div class="item" data-a="pack-open" data-p="__none" style="cursor:pointer;border:none;padding:0">'
      +'<div class="row" style="justify-content:space-between">'
      +'<div><div style="font-size:15px;font-weight:600">분류 없음</div><div class="meta">'+noneCount+'단어</div></div>'
      +'<span class="muted" style="font-size:18px">›</span></div></div></div>';
  }

  /* 아직 아무것도 없을 때 */
  if(!packPath && !kids.length && !noneCount)
    h+='<div class="panel"><div class="empty">'+lexi("idle","pop")
      +'<h3 style="margin-top:16px">아직 팩이 없습니다</h3>'
      +'<p>팩은 단어를 모아두는 폴더입니다. 드라마 회차나 시험 범위처럼<br>'
      +'나중에 "그때 그 단어들"을 찾고 싶은 단위로 만들면 됩니다.<br>'
      +'안 만들어도 단어는 넣을 수 있습니다.</p></div></div>';

  /* 이 경로에 직접 속한 단어 — 실패 많은 순 */
  if(packPath && exact.length){
    const sorted=[...exact].sort((a,b)=>b.lapses-a.lapses
      || (a.seen?a.correct/a.seen:1)-(b.seen?b.correct/b.seen:1)
      || a.word.localeCompare(b.word));
    h+='<div class="panel"><div class="h2">단어 '+sorted.length+'개 · 많이 틀린 순</div>';
    sorted.forEach(c=>{ const acc=c.seen?Math.round(c.correct/c.seen*100):null;
      h+='<div class="item"><div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap">'
        +'<div style="flex:1;min-width:0"><div class="itemw">'+esc(c.word)
        +(c.leech?' <span class="chip rev">누수</span>':'')
        +(c.susp?' <span class="chip">보류</span>':'')+'</div>'
        +'<div class="itemm">'+esc(c.meaning||"—")+'</div>'
        +(c.example?'<div class="itemex">'+esc(c.example)+'</div>':'')
        +'<div class="meta">'+(c.seen===0?"아직 안 봄":("실패 "+c.lapses+"회 · 정답률 "+acc+"% · "+c.interval+"일 간격"))+'</div></div>'
        +'<div class="row" style="flex-wrap:nowrap">'
        +(TTS.ok?'<button class="btn sm ghost" data-a="say-w" data-id="'+c.id+'">♪</button>':'')
        +'<button class="btn sm ghost" data-a="susp" data-id="'+c.id+'">'+(c.susp?"재개":"빼기")+'</button>'
        +'<button class="btn sm ghost" data-a="edit-go" data-id="'+c.id+'">수정</button>'
        +'</div></div></div>';
    });
    h+='</div>';
  }
  if(packPath && !exact.length && !kids.length) h+='<p class="note">이 팩에 단어가 없습니다.</p>';
  if(!packPath && !kids.length && !noneCount) h+='<div class="panel"><div class="empty" style="padding:32px 16px">'
    +'<h3>아직 팩이 없습니다</h3><p>미드 회차나 교재 단위로 먼저 만들어두면<br>단어를 넣을 때 목록에서 고르기만 하면 됩니다.</p>'
    +'<button class="btn" data-a="pack-new">＋ 첫 팩 만들기</button></div></div>';
  return h;
}

/* ── 단어 관리 ── */
let mq="", mflags=[], mtags=[], editing=null, formAuto=false;
function viewManage(){
  const tags=[...new Set(D.cards.flatMap(c=>c.tags||[]))].sort();
  const rev=D.cards.filter(c=>c.auto).length;
  const leechN=D.cards.filter(c=>c.leech).length;
  const suspN=D.cards.filter(c=>c.susp).length;
  const noneN=D.cards.filter(c=>!c.meaning).length;
  const list=D.cards.filter(c=>{
    const hay=(c.word+" "+c.meaning+" "+c.example+" "+(c.syn||"")+" "+(c.ant||"")).toLowerCase();
    if(mq && !hay.includes(mq.toLowerCase())) return false;
    /* 상태 조건은 고른 것을 모두 만족해야 합니다 */
    if(mflags.includes("rev")   && !c.auto) return false;
    if(mflags.includes("leech") && !c.leech) return false;
    if(mflags.includes("susp")  && !c.susp) return false;
    if(mflags.includes("none")  && c.meaning) return false;
    /* 태그는 고른 것 중 하나만 있으면 됩니다 */
    if(mtags.length && !mtags.some(t=>(c.tags||[]).includes(t))) return false;
    return true; });
  const e=editing?byId(editing):null;
  const curPack = e ? e.pack : (packPath && packPath!=="__none" ? packPath : (D.s.lastPack||""));
  let h = S ? '<div class="panel" style="padding:11px 15px"><div class="row" style="justify-content:space-between">'
    +'<span class="note" style="margin:0">학습이 진행 중입니다 ('+(S.idx+1)+'/'+S.queue.length+')</span>'
    +'<button class="btn sm" data-a="resume">학습으로 돌아가기</button></div></div>' : '';
  /* 빨리 넣는 데 필요한 건 단어와 뜻뿐입니다. 나머지는 접어 둡니다 */
  const hasDetail = !!(e && (e.example || e.collocation || e.syn || e.ant || (e.tags||[]).length));
  h+='<div class="panel"><div class="h2">'+(e?"단어 수정":"단어 추가")+'</div>'
    +'<div style="display:grid;gap:8px">'
    +'<div><div class="note" style="margin:0 0 4px">팩 — 어디서 모은 단어인지</div>'+packSelect("f-pack",curPack)+'</div>'
    +'<input class="field" id="f-word" placeholder="영단어" autocapitalize="off" spellcheck="false" value="'+esc(e?e.word:"")+'">'
    +'<input class="field" id="f-mean" placeholder="뜻 — 짧게, 여러 개면 / 로 구분" value="'+esc(e?e.meaning:"")+'">'
    +'<details class="set"'+(hasDetail?" open":"")+' style="margin:0">'
    +'<summary><strong>자세히</strong><span>예문 · 함께 쓰는 표현 · 비슷한 말 · 태그</span></summary>'
    +'<div class="inner" style="display:grid;gap:8px">'
    +'<input class="field" id="f-ex" placeholder="예문 — 미드 대사를 그대로 넣으면 기억에 잘 남습니다" value="'+esc(e?e.example:"")+'">'
    +'<input class="field" id="f-col" placeholder="함께 쓰는 표현 — 예: mitigate risk; mitigate the impact" value="'+esc(e?e.collocation:"")+'">'
    +'<div class="row" style="flex-wrap:nowrap">'
    +'<input class="field" id="f-syn" placeholder="비슷한 말 — 쉼표로 구분" value="'+esc(e?(e.syn||""):"")+'">'
    +'<input class="field" id="f-ant" placeholder="반대말 — 쉼표로 구분" value="'+esc(e?(e.ant||""):"")+'"></div>'
    +'<input class="field" id="f-tag" placeholder="태그 — 주제 표시, 쉼표로 구분 (예: 매크로, 시험)" value="'+esc(e?(e.tags||[]).join(", "):"")+'">'
    +'<p class="note" style="margin:0"><b>팩</b>은 폴더처럼 한 곳에만 넣는 것이고, '
    +'<b>태그</b>는 여러 개를 겹쳐 붙이는 주제 표시입니다. 아래 목록에서 태그로 걸러 볼 수 있습니다.<br>'
    +'<b>함께 쓰는 표현</b>은 그 단어가 보통 어떤 말과 붙어 다니는지입니다.<br>'
    +'<b>비슷한 말</b>과 <b>반대말</b>은 카드 뒷면에 초록·빨강으로 나뉘어 보입니다. 함께 외우면 더 잘 붙습니다.<br>'

  /* 여러 개를 함께 고를 수 있습니다. 상태는 모두 만족, 태그는 하나만 맞으면 됩니다 */
